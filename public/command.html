    if(d.settings.anchorMoved) h += '<div class="state wait" style="margin:12px 0">Pay periods now run from Saturday 19 September 2026 (paid Friday 9 October), the periods in Craig\'s 6 November workbook. Before 15 November the app counted them from 28 September. Check this in the payroll settings and save once to keep it.</div>';
    if(r.crewOnCalgary && r.crewOnCalgary.length){ const hrs = r.crewOnCalgary.reduce((x, c) => x + c.hours, 0);
      h += '<div class="card wide" style="margin-top:16px"><h2>Edmonton crew on Calgary jobs</h2><p class="lede">' + H2(hrs) + ' hours. ' + (r.crewRule === "crew" ? 'Counted as <b>Edmonton</b>, the crew\'s home city. Craig confirmed on 15 November that Calgary jobs belong in Calgary, so switch this back in the payroll settings.' : 'Counted as <b>Calgary</b>, the job\'s city. Craig confirmed on 15 November that Calgary jobs are set to Calgary, whoever works them.') + '</p>' +
        tbl('<th>Person</th><th>Job</th><th class="r">Hours</th><th>Counted as</th>', r.crewOnCalgary.map(c => '<tr><td>' + E(c.person) + '</td><td>' + E(c.job + " " + c.jobName) + '</td><td class="r num">' + H2(c.hours) + '</td><td>' + E(c.countedAs) + '</td></tr>')) + '</div>'; }
    if(r.noJobType && r.noJobType.length) h += '<div class="card wide" style="margin-top:16px"><h2>Jobs with no Job Type</h2><p class="lede">Danielle\'s rule is that hours go to the job\'s type. These jobs have none in JobTread, so the cost code on each time entry decided. Set the Job Type on the job and press Refresh.</p>' +
      tbl('<th>Job</th><th>Name</th><th>Counted as</th>', r.noJobType.map(j => '<tr><td>' + E(j.job) + '</td><td>' + E(j.jobName) + '</td><td>' + E(j.countedAs) + '</td></tr>')) + '</div>';

    /* the summary */
    const headRow = '<th>Employee</th><th class="r">Total</th><th class="r">Regular</th><th class="r">Overtime</th><th class="r">Not approved</th>' + bs.map(b => '<th class="r">' + E(b) + (r.overheadBuckets.includes(b) ? ' <span class="sm">stays</span>' : '') + '</th>').join("");
    const rows = r.employees.map(e => '<tr><td><span class="nm">' + E(e.name) + '</span></td><td class="r num"><b>' + H2(e.total) + '</b></td><td class="r num">' + H2(e.regular) + '</td><td class="r num">' + H2(e.overtime) + '</td><td class="r num"' + (e.unapproved ? ' style="color:var(--caution)"' : '') + '>' + H2(e.unapproved) + '</td>' +
      bs.map(b => '<td class="r num">' + H2(e.byBucket[b] && e.byBucket[b].total) + '</td>').join("") + '</tr>');
    rows.push('<tr><td><b>Total</b></td><td class="r num"><b>' + H2(r.totals.hours) + '</b></td><td></td><td></td><td class="r num">' + H2(r.totals.unapproved) + '</td>' + bs.map(b => '<td class="r num"><b>' + H2(r.totals.byBucket[b]) + '</b></td>').join("") + '</tr>');
    h += '<div class="card wide" data-tour="py-summary" style="margin-top:16px"><h2>Hours by employee and bucket</h2><p class="lede">Regular plus overtime hours. This is the report Danielle asked for. Download it for her with the buttons above.</p>' + tbl(headRow, rows, "No A&M employee hours in JobTread for this period yet.", 60) + '</div>';

    /* the journal entry */
    h += '<div class="card wide" data-py-form data-tour="py-journal" style="margin-top:16px"><h2>Journal entry</h2><p class="lede">Type each person\'s payroll cost from the QuickBooks pay run. The app splits it by share of pay, with overtime hours counted at ' + E(r.otMultiplier) + ' times, and moves the cost of sales part out of payroll expense. A journal entry is a manual adjustment in the books. Nothing reaches QuickBooks until you press Post. Costs typed here are not saved.</p>';
    h += '<div class="scroll"><table><thead><tr><th>Employee</th><th class="r">Pay hours</th><th class="r">Payroll cost</th></tr></thead><tbody>' +
      r.employees.map(e => '<tr><td>' + E(e.name) + '</td><td class="r num">' + H2(e.payHours) + '</td><td class="r"><input type="number" step="0.01" min="0" inputmode="decimal" style="width:130px;font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;text-align:right" data-py-cost="' + E(e.name) + '" value="' + E(PY.costs[e.name] === undefined ? "" : PY.costs[e.name]) + '"></td></tr>').join("") +
      '</tbody></table></div>';
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn ghost" data-py-preview' + (PY.busy ? " disabled" : "") + '>Show the entry</button>' +
      (!CAN_EDIT ? '' : d.posted ? '<button class="btn ghost" data-py-forget>Clear the posted record</button>' : '<button class="btn" data-py-post' + (PY.busy || !PY.journal || !PY.journal.ok || !d.quickbooks ? " disabled" : "") + '>Post to QuickBooks</button>') + '</div>';
    if(!CAN_EDIT) h += '<div class="state" style="margin-top:10px">Your account can see the entry but not post it. Ask an admin if you need to.</div>';
    if(!d.quickbooks) h += '<div class="state wait" style="margin-top:10px">QuickBooks is not connected to the app yet. Press Connect on QuickBooks in Settings, signed in to A&amp;M\'s company. You can still see the entry.</div>';
    if(PY.msg) h += '<div class="state ok" style="margin-top:10px">' + E(PY.msg) + '</div>';
    if(PY.jErr) h += failBox(PY.jErr, "Journal entry");
    if(PY.journal){
      const j = PY.journal;
      if(j.errors.length) h += '<div class="state wait" style="margin-top:10px">' + j.errors.map(E).join("<br>") + '</div>';
      if(j.lines.length) h += '<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Account</th><th>Class</th><th>Location</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead><tbody>' +
        j.lines.map(l => '<tr><td>' + E(l.accountName || l.bucket) + '<span class="sm">' + E(l.bucket) + '</span></td><td>' + E(l.className || "") + '</td><td>' + E(l.departmentName || "") + '</td><td class="r num">' + (l.posting === "Debit" ? D2(l.amount) : "") + '</td><td class="r num">' + (l.posting === "Credit" ? D2(l.amount) : "") + '</td></tr>').join("") +
        '</tbody></table></div><p class="sm" style="margin-top:6px">Entry ' + E(j.docNumber) + ', dated ' + E(p.end) + '. ' + D2(j.moved) + ' moves into cost of sales. Shop and office time stays in payroll expense.</p>';
    }
    h += '</div>';

    /* check before payroll */
    const openRows = r.open.map(o => '<tr><td>' + E(o.person) + (o.temp ? ' <span class="tag mute">ACES</span>' : '') + '</td><td>' + E(o.job + " " + o.jobName) + '</td><td>' + E(showWhen(o.since)) + '</td></tr>');
    const jobRows = r.assumedJobs.map(j => '<tr><td>' + E(j.job) + '</td><td>' + E(j.jobName) + '</td><td>' + E(j.city || "(blank)") + '</td><td>' + E(j.countedAs) + '</td></tr>');
    h += '<div class="grid" style="margin-top:16px"><div class="card"><h2>Still clocked in</h2><p class="lede">Not counted until they clock out. A shift running more than a day is almost always a missed clock-out.</p>' +
      tbl('<th>Person</th><th>Job</th><th>Since</th>', openRows, "Nobody is clocked in for this period.") + '</div>' +
      '<div class="card"><h2>Jobs with no Estimating branch</h2><p class="lede">The city came from the address. Fill in the branch on the job once and it drops off this list.</p>' +
      tbl('<th>Job</th><th>Name</th><th>City</th><th>Counted as</th>', jobRows, "Every job has a branch.") + '</div></div>';
    if(r.leftOut && r.leftOut.length) h += '<div class="card wide" style="margin-top:16px"><h2>Left out of the split</h2><p class="lede">Not hourly payroll, so their hours are not split or posted. Change this list in the payroll settings.</p>' +
      tbl('<th>Person</th><th>Why</th><th class="r">Hours in JobTread</th>', r.leftOut.map(l => '<tr><td>' + E(l.name) + '</td><td>' + E(l.reason) + '</td><td class="r num">' + H2(l.total) + '</td></tr>')) + '</div>';
    h += '<div class="card wide" style="margin-top:16px"><h2>ACES temp hours</h2><p class="lede">' + H2(r.tempHours) + ' hours from ' + plural(r.temps.length, "temp") + '. Billed by the staffing agency, so they are not part of the payroll split. Useful for checking the ACES invoice.</p></div>';

    h += pySettings(d.settings);
    return h;
  }
};
function pySettings(s){
  const L = PY.lists, sel = (kind, cur, list, attr) => {
    if(!L) return E(cur ? (cur.name || "") : "") || '<span class="sm">Not chosen</span>';
    return '<select ' + attr + ' style="font:inherit;font-size:13px;padding:5px;max-width:100%"><option value="">' + (kind === "account" ? "Choose an account" : "None") + '</option>' +
      list.map(x => '<option value="' + E(x.id) + '"' + (cur && String(cur.id) === String(x.id) ? " selected" : "") + '>' + E(x.name) + (x.type ? " (" + E(x.type) + ")" : "") + '</option>').join("") + '</select>';
  };
  const m = s.map || {}, c = s.credit;
  let h = '<details class="card wide" data-tour="py-settings" style="margin-top:16px"' + (PY.lists ? " open" : "") + '><summary style="cursor:pointer;font-weight:700">Payroll settings</summary>' +
    '<p class="lede" style="margin-top:8px">Danielle should check these once. Each bucket needs the QuickBooks labour account it posts to, and the class (service line) and location (city) if your books use them. Last saved by ' + E(s.updatedBy || "nobody yet") + '.</p>';
  if(PY.listsErr) h += failBox(PY.listsErr, "QuickBooks lists");
  if(!L) h += '<button class="btn ghost" data-py-lists>Load accounts and classes from QuickBooks</button>';
  else {
    h += '<div data-py-form class="scroll"><table><thead><tr><th>Bucket</th><th>Account</th><th>Class</th><th>Location</th></tr></thead><tbody>' +
      PY.data.report.cosBuckets.map(b => { const x = m[b] || {};
        return '<tr><td>' + E(b) + '</td><td>' + sel("account", { id:x.accountId }, L.accounts, 'data-py-map="' + E(b) + ':account"') + '</td><td>' + sel("class", { id:x.classId }, L.classes, 'data-py-map="' + E(b) + ':class"') + '</td><td>' + sel("department", { id:x.departmentId }, L.departments, 'data-py-map="' + E(b) + ':department"') + '</td></tr>'; }).join("") +
      '<tr><td><b>Comes out of</b><span class="sm">payroll expense</span></td><td>' + sel("account", { id:c && c.accountId }, L.accounts, 'data-py-map="credit:account"') + '</td><td>' + sel("class", { id:c && c.classId }, L.classes, 'data-py-map="credit:class"') + '</td><td></td></tr>' +
      '</tbody></table>' +
      '<div class="ctl" style="margin-top:12px"><label class="fld"><b>First day of a pay period</b><input type="date" data-py-set="anchor" value="' + E(s.anchor) + '"></label>' +
      '<label class="fld"><b>Overtime counts as</b><input type="number" step="0.5" min="1" max="3" data-py-set="otMultiplier" value="' + E(s.otMultiplier) + '"></label></div>' +
      '<label class="fld"><b>Jobs that stay in general payroll</b><textarea data-py-set="overhead" rows="3" style="font:inherit;font-size:13px;padding:7px;border:1px solid var(--rule);border-radius:3px">' + E(Object.entries(s.overheadJobs).map(([k, v]) => k + " = " + v).join("\n")) + '</textarea><span class="sm">One per line: job number = name. Add a training and safety job here once it exists in JobTread.</span></label>' +
      '<div class="ctl" style="margin-top:12px"><label class="fld"><b>Calgary jobs worked by the Edmonton crew count as</b><select data-py-set="crewRule" style="font:inherit;font-size:13px;padding:6px"><option value="job"' + (s.crewRule !== "crew" ? " selected" : "") + '>Calgary, the job\'s city (Craig, 15 Nov)</option><option value="crew"' + (s.crewRule === "crew" ? " selected" : "") + '>Edmonton, the crew\'s home city</option></select></label></div>' +
      '<label class="fld"><b>Calgary-based people</b><span class="sm">One name a line, as in JobTread. Everyone else is Edmonton crew.</span><textarea data-py-set="calgaryCrew" rows="2" style="font:inherit;font-size:13px;padding:7px;border:1px solid var(--rule);border-radius:3px">' + E((s.calgaryCrew || []).join("\n")) + '</textarea></label>' +
      '<label class="fld"><b>People left out of the split</b><textarea data-py-set="leaveOut" rows="3" style="font:inherit;font-size:13px;padding:7px;border:1px solid var(--rule);border-radius:3px">' + E(Object.entries(s.leaveOut || {}).map(([k, v]) => k + " = " + v).join("\n")) + '</textarea><span class="sm">One per line: name exactly as in JobTread = why. Salaried staff and subcontractors go here.</span></label>' +
      (CAN_EDIT ? '<div style="margin-top:12px"><button class="btn" data-py-save>Save settings</button></div>' : '<div class="state" style="margin-top:12px">Your account can look at these settings but not change them.</div>') + '</div>';
  }
  return h + '</details>';
}
function pyEditSettings(){
  if(!PY.edit) PY.edit = JSON.parse(JSON.stringify(PY.data.settings));
  return PY.edit;
}
document.addEventListener("click", ev => {
  if(ev.target.closest && ev.target.closest("[data-py-tour]")){ CCTOUR.payroll(); return; }
  { const w = ev.target.closest && ev.target.closest("[data-walk]"); if(w){ CCTOUR.walk(w.dataset.walk); return; } }
  if(ev.target.closest && ev.target.closest("[data-py-xlsx]")){ pyWorkbook(); return; }
  if(ev.target.closest && ev.target.closest("[data-ex-split]")){ exSplitWorkbook(); return; }
  const t = ev.target.closest && ev.target.closest("[data-py-go],[data-py-csv],[data-py-preview],[data-py-post],[data-py-forget],[data-py-lists],[data-py-save]");
  if(!t) return;
  if(t.dataset.pyGo){ PY.data = PY.data && PY.data.report.period.start === t.dataset.pyGo ? PY.data : null; loadPY(t.dataset.pyGo); render(); return; }
  if(t.dataset.pyCsv){ pyDownload(t.dataset.pyCsv); return; }
  const start = PY.data && PY.data.report.period.start;
  if(t.dataset.pyPreview !== undefined || t.dataset.pyPost !== undefined){
    const post = t.dataset.pyPost !== undefined;
    if(post && !confirm("Post this journal entry to QuickBooks? It moves " + D2(PY.journal && PY.journal.moved) + " from payroll expense into cost of sales for " + start + " to " + PY.data.report.period.end + ". It can only be posted once per pay period.")) return;
    PY.busy = true; PY.jErr = null; PY.msg = ""; render();
    pyCall("", { action:"journal", start, costs: PY.costs, post }).then(res => {
      PY.busy = false; PY.journal = res.journal;
      if(res.posted && post){ PY.data.posted = res.posted; PY.msg = "Posted. Journal entry " + res.posted.docNumber + " is in QuickBooks."; }
      render();
    }).catch(e => { PY.busy = false; PY.jErr = e; if(e.journal) PY.journal = e.journal; if(e.posted) PY.data.posted = e.posted; render(); });
    return;
  }
  if(t.dataset.pyForget !== undefined){
    if(!confirm("Only do this after deleting the journal entry in QuickBooks. Clear the posted record for this period?")) return;
    pyCall("", { action:"forget", start }).then(() => { PY.data.posted = null; PY.journal = null; render(); }).catch(e => { PY.jErr = e; render(); });
    return;
  }
  if(t.dataset.pyLists !== undefined){
    t.disabled = true; t.textContent = "Reading QuickBooks…";
    pyCall("action=lists").then(l => { PY.lists = l; PY.listsErr = null; render(); }).catch(e => { PY.listsErr = e; render(); });
    return;
  }
  if(t.dataset.pySave !== undefined){
    const s = pyEditSettings(); t.disabled = true; t.textContent = "Saving…";
    pyCall("", { action:"settings", settings: s }).then(res => { PY.data.settings = res.settings; PY.edit = null; PY.journal = null; PY.msg = ""; loadPY(PY.start); })
      .catch(e => { PY.listsErr = e; render(); });
  }
});
document.addEventListener("input", ev => {
  const el = ev.target; if(!el.dataset) return;
  if(el.dataset.pyCost !== undefined){ if(el.value === "") delete PY.costs[el.dataset.pyCost]; else PY.costs[el.dataset.pyCost] = el.value; PY.journal = null; return; }
  if(el.dataset.pySet){
    const s = pyEditSettings();
    if(el.dataset.pySet === "overhead"){
      const o = {}; el.value.split("\n").forEach(line => { const i = line.indexOf("="); if(i > 0){ const k = line.slice(0, i).trim(), v = line.slice(i + 1).trim(); if(k && v) o[k] = v; } });
      s.overheadJobs = o;
    } else if(el.dataset.pySet === "leaveOut"){
      const o = {}; el.value.split("\n").forEach(line => { const i = line.indexOf("="); const k = (i > 0 ? line.slice(0, i) : line).trim(), v = i > 0 ? line.slice(i + 1).trim() : "Left out"; if(k) o[k] = v || "Left out"; });
      s.leaveOut = o;
    } else if(el.dataset.pySet === "calgaryCrew"){
      s.calgaryCrew = el.value.split("\n").map(x => x.trim()).filter(Boolean);
    } else s[el.dataset.pySet] = el.value;
  }
});
document.addEventListener("change", ev => {
  const el = ev.target; if(!el.dataset || !el.dataset.pyMap) return;
  const [b, kind] = el.dataset.pyMap.split(":"), s = pyEditSettings(), L = PY.lists;
  const list = kind === "account" ? L.accounts : kind === "class" ? L.classes : L.departments;
  const hit = list.find(x => String(x.id) === el.value);
  const slot = b === "credit" ? (s.credit = s.credit || {}) : (s.map[b] = s.map[b] || {});
  slot[kind + "Id"] = hit ? hit.id : ""; slot[kind + "Name"] = hit ? hit.name : "";
});

  const fmt = t => {
    let h = E(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

    lines.forEach(l => { const m = l.match(/^\s*[-*•]\s+(.*)$/);
      if(m){ if(!inList){ out.push("<ul>"); inList = true; } out.push("<li>" + m[1] + "</li>"); }
      else { if(inList){ out.push("</ul>"); inList = false; } out.push(l + "<br>"); } });
    if(inList) out.push("</ul>");
    return out.join("").replace(/(<br>)+$/, "");
  };
  function pageText(){
    const main = document.getElementById("main"); let t = main ? main.innerText : "";
    const dr = document.getElementById("drawer"); if(dr && !dr.hidden) t = "OPEN AT THE SIDE: " + document.getElementById("dtitle").innerText + "\n" + document.getElementById("dbody").innerText + "\n\n" + t;
    return t.replace(/\n{3,}/g, "\n\n").slice(0, 16000);
  }
  const tabName = () => (TABS[current] && TABS[current].label) || "Overview";
  function handOver(q){
    const page = pageText().slice(0, 1800);
    const prompt = "I am looking at the A&M Abatement Office Command Centre, on the " + tabName() + " page. This is what it shows:\n\n" + page + "\n\n" + (q ? "My question: " + q : "Help me understand this page.");

  }
  function mount(){

    document.body.appendChild(bub);
    try{ const p = JSON.parse(store(POS) || "null"); if(p){ bub.style.left = p.x + "px"; bub.style.top = p.y + "px"; bub.style.right = "auto"; bub.style.bottom = "auto"; clampBub(); } }catch(e){}
    dragBubble();
    document.addEventListener("keydown", ev => { if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "j"){ ev.preventDefault(); toggle(); } if(ev.key === "Escape" && panel && !panel.hidden) close(); });
  }
  function clampBub(){ const r = bub.getBoundingClientRect(), x = Math.min(Math.max(8, r.left), innerWidth - r.width - 8), y = Math.min(Math.max(70, r.top), innerHeight - r.height - 8); bub.style.left = x + "px"; bub.style.top = y + "px"; }
  function dragBubble(){
    let s = null;
    bub.addEventListener("pointerdown", ev => { const r = bub.getBoundingClientRect(); s = { x: ev.clientX, y: ev.clientY, ox: ev.clientX - r.left, oy: ev.clientY - r.top, moved:false }; bub.setPointerCapture(ev.pointerId); });
    bub.addEventListener("pointermove", ev => {
      if(!s) return;
      if(!s.moved && Math.hypot(ev.clientX - s.x, ev.clientY - s.y) < 6) return;
      s.moved = true; bub.classList.add("dragging"); bub.style.right = "auto"; bub.style.bottom = "auto";
      bub.style.left = (ev.clientX - s.ox) + "px"; bub.style.top = (ev.clientY - s.oy) + "px";
    });
    bub.addEventListener("pointerup", () => {
      if(!s) return; const moved = s.moved; s = null; bub.classList.remove("dragging");
      if(!moved) return toggle();

      setTimeout(() => { bub.style.transition = ""; }, 320);

  }
  function build(){

    panel.innerHTML = '<div class="ch" id="cHead"><span class="grip"></span><div><b>Ask Claude</b><div class="sm" id="cSub">Reads this page with you</div></div><button class="cx" type="button" aria-label="Close" id="cClose">&times;</button></div>' +
      '<div id="cMsgs" aria-live="polite"></div><div id="cChips"></div>' +

    panel.querySelector("#cHand").addEventListener("click", ev => { const a = ev.currentTarget; a.href = handOver(ta.value || lastQ()); setTimeout(() => { a.href = "#"; }, 0); });

    panel.addEventListener("click", ev => {
      const c = ev.target.closest(".chip"); if(c) return ask(c.textContent);
      const k = ev.target.closest("[data-ccopy]"); if(!k) return;
      const m = msgs[Number(k.dataset.ccopy)]; if(!m) return;
      const done = () => { k.textContent = "Copied"; setTimeout(() => { k.textContent = "Copy"; }, 1800); };
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(m.content) : Promise.reject()).then(done, () => { const r = document.createRange(); r.selectNodeContents(k.parentNode.querySelector(".ctext")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand("copy"); sel.removeAllRanges(); done(); });
    });

  }
  const lastQ = () => { for(let i = msgs.length - 1; i >= 0; i--) if(msgs[i].role === "user") return msgs[i].content; return ""; };
  function grow(){ const t = panel.querySelector("#cIn"); t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
  function dragPanel(){
    const head = panel.querySelector("#cHead"); let s = null;
    head.addEventListener("pointerdown", ev => { if(ev.target.closest("button")) return; const r = panel.getBoundingClientRect(); s = { x: ev.clientX, y: ev.clientY, r, phone: innerWidth <= 640 }; head.setPointerCapture(ev.pointerId); panel.style.transition = "none"; });

      const x = Math.min(Math.max(8, s.r.left + ev.clientX - s.x), innerWidth - s.r.width - 8), y = Math.min(Math.max(60, s.r.top + ev.clientY - s.y), innerHeight - 160);
      Object.assign(panel.style, { left: x + "px", top: y + "px", right: "auto", bottom: "auto", height: s.r.height + "px" });

  function chips(){
    const list = CHIPS[current] || ["Summarize this page", "What needs a decision here?"];
    panel.querySelector("#cChips").innerHTML = msgs.length > 6 ? "" : list.map(c => '<button type="button" class="chip">' + E(c) + '</button>').join("");
    panel.querySelector("#cSub").textContent = "Reading the " + tabName() + " page with you";
  }
  function draw(){
    const box = panel.querySelector("#cMsgs");
    if(!msgs.length) box.innerHTML = '<div class="cm a">Hi ' + E(S.meName || "") + '. I can see the ' + E(tabName()) + ' page you have open. Ask me what something means, what to deal with first, or where to go to fix it. I can read, but I cannot change anything.</div>';
    else box.innerHTML = msgs.map((m, i) => '<div class="cm ' + (m.role === "user" ? "u" : "a") + (m.typing ? " typing" : "") + '">' + (m.role === "user" ? E(m.content) : '<div class="ctext">' + fmt(m.content) + '</div>' + (!m.typing && !m.err && m.content ? '<button type="button" class="ccopy" data-ccopy="' + i + '">Copy</button>' : '')) + '</div>').join("") + (busy && !msgs[msgs.length - 1].content ? '<div class="cthink"><i></i><i></i><i></i></div>' : '');
    box.scrollTop = box.scrollHeight; chips();

  async function ask(q){
    q = String(q || "").trim(); if(!q || busy) return;

    try{
      const r = await fetch("/api/claude", { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" },
        body: JSON.stringify({ question:q, page:{ tab: current, title: tabName(), text: pageText() }, history: msgs.slice(0, -2).slice(-HIST).map(m => ({ role:m.role, content:m.content })) }) });

/* ---------- Admin, Connections ---------- */
/* Each card on this page fetches what it shows while the page draws. Every
   answer redraws the page, so without the loading flags below every redraw
   sent the same requests again and the page flickered for seconds on end
   (Bruce, 2026-10-18). One request at a time per card. */
const CN = { data:null, err:null, msg:"", mail:null, claude:null, loading:false };
function cnCall(body){
  const opts = body ? { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" }, body: JSON.stringify(body) } : { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" };
  return fetch("/api/connections", opts).then(async r => { const b = await r.json().catch(() => ({})); if(!r.ok) throw { code: b.error || "http_" + r.status, message: b.message || ("The app answered " + r.status + ".") }; return b; });
}
function loadCN(){
  if(CN.loading) return;
  CN.loading = true;
  cnCall().then(d => { CN.data = d; CN.err = null; }).catch(e => { CN.err = e; }).then(() => { CN.loading = false; render(); });
  if(ME.areas.includes("assistants")) fetch("/api/mail?action=status", { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" }).then(r => r.json()).then(m => { CN.mail = m; render(); }).catch(() => {});
  if(ME.claude) fetch("/api/claude", { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" }).then(r => r.json()).then(c => { CN.claude = c; render(); }).catch(() => {});
  if(ME.admin) fetch("/api/inbox?shared=estimating", { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" }).then(r => r.json()).then(e => { CN.est = e; render(); }).catch(() => {});
}
/* ---------- The equipment Google Sheet as the master list (Craig, 2026-11-20) ----------
   Server: equipment-sheet.mjs and _equipsheet.mjs. New rows on the sheet are
   added to the shop every 15 minutes in working hours if they pass the
   checks (tag, name, group, unit number, serial, and next in sequence);
   the rest wait here with the reason. */
const EQS = { d:null, err:null, loading:false, busy:"", msg:"", url:"" };
function eqsLoad(){
  if(EQS.loading || PLATFORM !== "app") return; EQS.loading = true;
  fetch("/api/equipment-sheet", { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" }).then(async r => { const b = await r.json().catch(() => ({})); if(!r.ok) throw b; EQS.d = b; EQS.err = null; })
    .catch(e => { EQS.err = e; }).finally(() => { EQS.loading = false; render(); });
}
function eqsDo(body, btnLabel){
  EQS.busy = body.action + (body.tag || ""); EQS.msg = ""; render();
  return fetch("/api/equipment-sheet", { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" }, body: JSON.stringify(body) })
    .then(async r => { const b = await r.json().catch(() => ({})); if(!r.ok) throw b; return b; })
    .then(b => { const res = b.result || {};
      EQS.msg = body.action === "useSheet" ? "The sheet's values are on " + plural((b.updated || []).length, "machine") + "."
        : res.applied ? (res.added && res.added.length ? "Added " + res.added.join(", ") + "." : "Checked. Nothing new to add.") : res.wouldAdd ? "Read the sheet: " + plural(res.rows, "row") + "." : "Done.";
      if(body.action === "disconnect") EQS.msg = "Disconnected. The shop keeps every machine it has."; })
    .catch(e => { EQS.msg = e.message || "That did not work."; })
    .finally(() => { EQS.busy = ""; EQS.d = null; eqsLoad(); });
}
function eqsAlerts(){
  const d = EQS.d; if(!d){ if(PLATFORM === "app" && !EQS.err) eqsLoad(); return []; }
  if(!d.connected) return [];
  const L = d.last || {}, a = [];
  if(L.error) a.push({ lvl:"stop", text:"The equipment sheet could not be checked.", meta: L.error });
  if((L.held || []).length) a.push({ lvl:"caution", text: plural(L.held.length, "new row on the equipment sheet is", "new rows on the equipment sheet are") + " waiting, not added.", meta: L.held.slice(0, 3).map(h => h.tag + ": " + h.why[0]).join("; ") });
  if(L.changedCount) a.push({ lvl:"info", text:"The equipment sheet and the shop disagree on " + plural(L.changedCount, "machine") + ".", meta:"Serials, models or status. Confirm them on Equipment." });
  if(!d.auto) a.push({ lvl:"info", text:"The equipment sheet is connected but not checking on its own yet.", meta:"An admin presses Start on Equipment or Connections." });
  return a;
}
const eqsBtn = (action, label, extra, ghost) => '<button type="button" class="btn' + (ghost ? " ghost" : "") + ' sm" data-eqs="' + action + '"' + (extra || "") + (EQS.busy === action ? " disabled" : "") + '>' + (EQS.busy === action ? "Working…" : label) + '</button>';

/* ================= BILLING RULES AND THE CREW BOARD (Upload 1, 2026-10-10) =================
   Billing rules live on each customer in JobTread (Invoice Email, Invoice
   Cut-off, PO Required, Subcontract Number Required, Holdback %, Billing
   Portal, Client Template Required, Billing Notes), loaded once from Craig's

const custRules = j => (S.billing && S.billing.rules && j._custId && S.billing.rules[j._custId]) || null;

   (JobTread allows 25 fields on a job and A&M uses all 25): the crew are the

const crewOf = j => ((crewRec(j) || {}).members || []).map(m => m.name).filter(Boolean);
const leadOf = j => (crewRec(j) || {}).lead || "";
const timeOf = (j, k) => (crewRec(j) || {})[k] || "";
function loadCrew(force){
  if(PLATFORM !== "app" || !S.jobs) return;
  const ids = boardJobs().map(j => j._id), key = ids.join(",");
  if(!ids.length || (!force && S.crewKey === key)) return;
  S.crewKey = key;
  /* Thirty jobs a call. The server asks JobTread a few at a time, and a job
     JobTread still refuses comes back in "failed" so the rest of the board loads. */
  const groups = []; for(let i = 0; i < ids.length; i += 30) groups.push(ids.slice(i, i + 30));
  const one = g => fetch("/api/command?part=crew&ids=" + encodeURIComponent(g.join(",")), { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" })
    .then(async r => { const b = await r.json().catch(() => ({})); if(!r.ok) throw { code: b.error || "http_" + r.status, message: b.message || "The app answered " + r.status + "." }; return b; })

      S.crew = Object.assign({}, S.crew || {}, add); S.crewErr = null; render();

const isYes = v => v === true || /^(true|yes|1)$/i.test(String(F(v) || ""));
function nextCutoff(rule){
  const r = String(rule || "").trim().toLowerCase(); if(!r) return null;
  const d0 = today(), last = (y, m) => new Date(y, m + 1, 0);
  const pick = fn => { for(let k = 0; k < 3; k++){ const b = new Date(d0.getFullYear(), d0.getMonth() + k, 1); const d = fn(b.getFullYear(), b.getMonth()); if(d && d >= d0) return d; } return null; };
  const n = r.match(/^(\d{1,2})(st|nd|rd|th)?$/);
  if(n){ const day = Math.min(31, Math.max(1, +n[1])); return pick((y, m) => new Date(y, m, Math.min(day, last(y, m).getDate()))); }
  if(/month\s*end|end of (the )?month/.test(r) && !/working/.test(r)) return pick((y, m) => last(y, m));
  const w = r.match(/(\d+)\s*working days? before (the )?(end of (the )?month|month\s*end)/);
  if(w) return pick((y, m) => { let d = last(y, m), left = +w[1]; while(left > 0){ d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); if(d.getDay() && d.getDay() !== 6) left--; } return d; });
  return null;
}
/* What a job ready to bill needs, from its client's rules. */
function billPlan(j){
  const r = custRules(j); if(!r) return null;
  const cut = nextCutoff(F(r["Invoice Cut-off"])), days = cut ? Math.round((cut - today()) / 86400000) : null;
  const flags = [];
  const po = String(F(j["Customer PO"]) || "").trim(), poSt = F(j["PO Status"]);
  if(isYes(r["PO Required"]) && !po && poSt !== "Received") flags.push({ lvl:"stop", t:"PO needed, none on the job" });
  else if(isYes(r["PO Required"])) flags.push({ lvl:"mute", t:"Quote PO " + (po || "on file") });
  if(isYes(r["Subcontract Number Required"])) flags.push({ lvl:"caution", t:"Subcontract number on the invoice" });
  const hb = parseFloat(F(r["Holdback %"])); if(hb > 0) flags.push({ lvl:"mute", t: hb + "% holdback" });
  const portal = F(r["Billing Portal"]); if(portal && portal !== "Email") flags.push({ lvl:"caution", t:"Through " + portal });
  const tpl = F(r["Client Template Required"]); if(tpl) flags.push({ lvl:"caution", t:"Their template: " + tpl });

      '<button type="button" class="btn ghost" data-cb-wo="' + E(j._id) + '">Work order</button></div></div>';
  }).join("") + '</div></div>';
  return h;
}
function cbSave(id, patch, said){
  const j = (S.jobs || []).find(x => x._id === id); const rec = j && crewRec(j); if(!rec) return;

}

/* ================= UPLOAD 2 (2026-10-10): field record, T&M and extras, daily logs,
   emergencies, the lead clock, clients and scorecards =================
   All read from what JobTread, QuickBooks and the shop already hold. Nothing new
   is typed anywhere: the timesheets and daily logs come from JobTread (part
   "field", the last three weeks), quotes and change orders from JobTread's
   documents, what clients owe from QuickBooks, gear out from the shop. */
const TZ = "America/Edmonton";
const dkey = t => new Date(t).toLocaleDateString("en-CA", { timeZone: TZ });
const todayKey = () => dkey(Date.now());
function lastWorkdayKey(){ let d = new Date(); do { d = new Date(d.getTime() - 86400000); } while([0, 6].includes(new Date(d.toLocaleString("en-US", { timeZone: TZ })).getDay())); return dkey(d); }
const hrs = m => Math.round((m || 0) / 6) / 10;
const fieldOn = () => !!(S.field && S.field.entries);
const entriesFor = id => fieldOn() ? S.field.entries.filter(e => e.job === id && e.m > 0) : [];
const logsFor = id => fieldOn() ? S.field.logs.filter(l => l.job === id) : [];
const isOverhead = j => isSpecial(j) || /general shop|shop work|office work/i.test(j._name || "");
const jobById = id => (S.jobs || []).find(j => j._id === id);
function fieldWait(){ return S.fieldErr ? failBox(S.fieldErr, "Timesheets and daily logs") : wait("the timesheets and daily logs"); }

/* ---------- daily logs (Sites) ---------- */
/* Every job someone was on the clock for today or on the last working day,
   with whether a daily log was written for it that day. SOP Phase 5: the site
   supervisor sends the PM a daily update; the daily log in JobTread is it. */
function logGaps(){
  if(!fieldOn() || !S.jobs) return [];
  const days = [todayKey(), lastWorkdayKey()], out = [];
  days.forEach(day => {
    const by = {};
    S.field.entries.filter(e => e.m > 0 && e.at && dkey(e.at) === day).forEach(e => { (by[e.job] = by[e.job] || []).push(e); });
    Object.entries(by).forEach(([id, es]) => {
      const j = jobById(id); if(!j || isOverhead(j)) return;
      const log = S.field.logs.find(l => l.job === id && l.date === day);
      out.push({ j, day, who: [...new Set(es.map(e => e.who).filter(Boolean))], m: es.reduce((s, e) => s + e.m, 0), log });
    });
  });
  return out;
}
function logAlerts(){
  const g = logGaps().filter(x => !x.log && x.day !== todayKey());
  return g.length ? [{ lvl:"caution", text: plural(g.length, "job", "jobs") + " had a crew on the clock on " + lastWorkdayKey() + " and no daily log.", meta:"The daily log is how the PM hears what happened on site (SOP Phase 5): " + g.map(x => x.j._number).join(", ") + "." }] : [];
}
function logCard(){
  let h = '<div class="card wide"><h2>Daily logs</h2><p class="lede">Jobs with a crew on the clock today or last working day, and whether a daily log was written.</p>';
  if(!fieldOn()) return h + fieldWait() + '</div>';
  const g = logGaps().sort((a, b) => (!!a.log - !!b.log) || b.day.localeCompare(a.day));
  return h + tbl('<th>Job</th><th>Day</th><th>On the clock</th><th class="r">Hours</th><th>Daily log</th>', g.map(x =>
    '<tr data-job="' + E(x.j._id) + '" tabindex="0"><td>' + jobCell(x.j) + '</td><td>' + (x.day === todayKey() ? "Today" : E(x.day)) + '</td><td>' + E(x.who.join(", ")) + '</td><td class="r num">' + hrs(x.m) + '</td><td>' +
    (x.log ? '<span class="tag clear">Written</span> <span class="sm">by ' + E(x.log.who || "someone") + (x.log.words < 8 ? ", very short" : "") + '</span>' : '<span class="tag ' + (x.day === todayKey() ? "mute" : "caution") + '">' + (x.day === todayKey() ? "Not yet" : "Missing") + '</span>') + '</td></tr>'), "Nobody has been on the clock on a job today or on the last working day.", 30) + '</div>';
}

/* ---------- emergencies and drying (Dispatch) ---------- */
const isEmerg = j => /E\d*$/.test(j._number || "") || /emerg|flood|mitigation|drying|water damage/i.test((j._name || "") + " " + (F(j["Notes"]) || "")) || types(j).includes("Mitigation") || !!F(j["Type of Loss"]);
function emergencies(){
  if(!S.jobs) return [];
  return live().filter(isEmerg).map(j => {
    const es = entriesFor(j._id).slice().sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const first = es[0] && es[0].at, created = j._created;
    const resp = first && created ? (new Date(first) - new Date(created)) / 3600000 : null;
    const logs = logsFor(j._id).map(l => l.date).sort();
    const shop = (S.inv && S.inv.jobs || []).find(x => x.jobtreadId === j._id || x.jobtreadNumber === j._number);
    const since = (Date.now() - new Date(created)) / 3600000;
    return { j, first, resp, since, lastLog: logs[logs.length - 1] || "", machines: shop ? shop.machinesOut || 0 : null, days: startOf(j) ? -daysTo(startOf(j)) : null };
  }).sort((a, b) => a.since - b.since);
}
function emergAlerts(){
  if(!fieldOn()) return [];
  const a = [], L = emergencies();
  const cold = L.filter(x => !x.first && x.since > 4 && x.since < 72);
  if(cold.length) a.push({ lvl:"stop", text: plural(cold.length, "emergency job was", "emergency jobs were") + " opened over four hours ago and nobody has been on the clock for it.", meta: cold.map(x => x.j._number + " " + x.j._name).join("; ") + "." });
  const quiet = L.filter(x => stageOf(st(x.j)) === "site" && x.machines && (!x.lastLog || daysTo(x.lastLog) < -2));
  if(quiet.length) a.push({ lvl:"caution", text: plural(quiet.length, "drying job has", "drying jobs have") + " equipment on site and no daily log in two days.", meta:"Drying needs a reading every day, written in the daily log: " + quiet.map(x => x.j._number).join(", ") + "." });
  return a;
}
function emergCard(){
  let h = '<div class="card wide"><h2>Emergencies and drying</h2><p class="lede">Open emergency and drying jobs: how fast a crew got there, days running, last daily log, machines out.</p>';
  if(!fieldOn()) return h + fieldWait() + '</div>';
  const L = emergencies();
  return h + tbl('<th>Job</th><th>Status</th><th class="r">First on the clock</th><th class="r">Running</th><th>Last daily log</th><th class="r">Machines out</th>', L.map(x =>
    '<tr data-job="' + E(x.j._id) + '" tabindex="0"><td>' + jobCell(x.j) + '</td><td>' + stTag(x.j) + '</td><td class="r">' +
    (x.resp !== null ? '<span class="tag ' + (x.resp > 4 ? "caution" : "clear") + '">' + (x.resp < 1 ? "Within the hour" : Math.round(x.resp) + " h after opening") + '</span>' : (x.since < 72 ? '<span class="tag stop">Nobody yet</span>' : '<span class="sm">Before ' + E(S.field.since) + '</span>')) + '</td>' +
    '<td class="r num">' + (x.days !== null && x.days >= 0 ? plural(x.days, "day") : "") + '</td><td>' + (x.lastLog ? E(x.lastLog) : '<span class="tag caution">None in three weeks</span>') + '</td><td class="r num">' + (x.machines === null ? "" : x.machines) + '</td></tr>'),
    "No emergency or drying jobs open.", 20) + '</div>';
}

/* ---------- the lead clock (Estimating) ---------- */
/* SOP Phase 1: a lead is logged within 2 hours, assigned within 4 business
   hours, and an urgent site visit happens within 48 hours (5 business days for
   planned work). Business hours here are 7 a.m. to 5 p.m., Monday to Friday. */
function bizHours(fromIso){
  let t = new Date(fromIso).getTime(); const end = Date.now(); if(!(t < end)) return 0;
  let n = 0, guard = 0;
  while(t < end && guard++ < 2000){ const d = new Date(new Date(t).toLocaleString("en-US", { timeZone: TZ })); const h = d.getHours(), wd = d.getDay(); if(wd > 0 && wd < 6 && h >= 7 && h < 17) n++; t += 3600000; }
  return n;
}
function leadClock(){
  if(!S.jobs) return [];
  return live().filter(j => ["lead","est"].includes(stageOf(st(j))) && (daysSince(j._created) || 0) <= 45).map(j => {
    const bh = bizHours(j._created), g = stageOf(st(j)), sv = F(j["Site Visit Date and Time"]);
    let flag = null;
    if(g === "lead" && bh > 4) flag = { lvl: bh > 8 ? "stop" : "caution", t:"Not picked up after " + bh + " business hours" };
    else if(g === "est" && !sv && bh > 50 && !/plan|tender/i.test(F(j["Bid Type"]) || "")) flag = { lvl:"caution", t:"No site visit booked after " + Math.round(bh / 10) + " business days" };
    return { j, bh, sv, flag };
  }).sort((a, b) => (!!b.flag - !!a.flag) || b.bh - a.bh);
}
function leadAlerts(){
  const L = leadClock(), np = L.filter(x => x.flag && /picked/.test(x.flag.t)), nv = L.filter(x => x.flag && /site visit/.test(x.flag.t));
  const a = [];
  if(np.length) a.push({ lvl: np.some(x => x.flag.lvl === "stop") ? "stop" : "caution", text: plural(np.length, "new lead is", "new leads are") + " still at New Lead after four business hours.", meta:"SOP Phase 1: assigned to an estimator within four hours. " + np.map(x => x.j._number).join(", ") + "." });
  if(nv.length) a.push({ lvl:"caution", text: plural(nv.length, "lead being estimated has", "leads being estimated have") + " no site visit booked after five business days.", meta: nv.map(x => x.j._number).join(", ") + ". Tenders with plans are left out." });
  return a;
}
function leadCard(){
  const L = leadClock();
  return '<div class="card wide"><h2>Lead clock</h2><p class="lede">Open leads, timed in business hours from when they were opened. SOP: assigned within 4 hours, site visit within 2 business days if urgent, 5 if planned.</p>' +
    tbl('<th>Job</th><th>Status</th><th class="r">Age</th><th>Site visit</th><th>Clock</th>', L.map(x =>
      '<tr data-job="' + E(x.j._id) + '" tabindex="0"><td>' + jobCell(x.j) + '</td><td>' + stTag(x.j) + '</td><td class="r num">' + (x.bh < 10 ? x.bh + " h" : Math.round(x.bh / 10) + " days") + '</td><td>' + (x.sv ? E(showWhen(x.sv)) : '<span class="sm">Not booked</span>') + '</td><td>' +
      (x.flag ? '<span class="tag ' + x.flag.lvl + '">' + E(x.flag.t) + '</span>' : '<span class="tag clear">On time</span>') + '</td></tr>'), "No open leads from the last 45 days.", 20) + '</div>';
}

/* ---------- T&M and extras ---------- */
const isTM = j => /T&M|-TM\b|\bTM\b|time and material/i.test((j._number || "") + " " + (j._name || "") + " " + (F(j["Notes"]) || ""));
const isCO = o => /change order|\bc\.?o\.?\s*#?\s*\d|\bextra|\badditional work/i.test(o.name || "");
function tmJobs(){
  if(!S.jobs) return [];
  return (S.jobs || []).filter(j => isTM(j) && (isOpen(j) || entriesFor(j._id).length)).map(j => {
    const es = entriesFor(j._id), wk = Date.now() - 7 * 86400000;
    return { j, m21: es.reduce((s, e) => s + e.m, 0), m7: es.filter(e => new Date(e.at) > wk).reduce((s, e) => s + e.m, 0), people: [...new Set(es.map(e => e.who))].length,
      lastLog: logsFor(j._id).map(l => l.date).sort().pop() || "" };

/* ---------- Google Drive, read as each person ---------- */
const DRV = { st:null, err:null, job:{}, pending:null };
function driveCall(body){
  return fetch("/api/drive" + (body && body.get ? "?action=" + body.get : ""), body && !body.get ? { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" }, body: JSON.stringify(body) } : { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" })
    .then(async r => { const b = await r.json().catch(() => ({})); if(!r.ok) throw { code: b.error || "http_" + r.status, message: b.message || "The app answered " + r.status + "." }; return b; });
}
function driveStatus(force){
  if(PLATFORM !== "app") return Promise.resolve(null);
  if(DRV.st && !force) return Promise.resolve(DRV.st);
  /* Everyone asking at once shares the one request already on its way. */
  if(DRV.pending && !force) return DRV.pending;
  DRV.pending = driveCall().then(d => { DRV.st = d; DRV.err = null; return d; }).catch(e => { DRV.err = e; return null; }).then(d => { DRV.pending = null; return d; });
  return DRV.pending;
}
function driveBlock(){
  const d = DRV.st;
  if(!d) return '<h3>Google Drive</h3><p class="sub" id="meDrive">' + (DRV.err ? E(errCopy(DRV.err)) : "Checking…") + '</p>';
  if(!d.ready) return '<h3>Google Drive</h3><p class="sub">Not set up yet. An admin adds the Google settings in Netlify first.</p>';
  if(d.connected) return '<h3>Google Drive</h3><p class="sub">Connected as <b>' + E(d.email || "your Google account") + '</b> since ' + E(showDate(d.since)) + '. Read only. Claude can read A&amp;M\'s documents for you, and each job shows its Drive folder, only ever what your own Google account can open.</p><div class="actions"><button type="button" class="btn ghost" data-drv="forget">Disconnect Google Drive</button></div>';
  return '<h3>Google Drive</h3><p class="sub">Connect your A&amp;M Google account once, read only. Then Claude can answer from the SOP, your role profile and other A&amp;M documents, and each job shows its Drive folder. You only ever see what your own Google account can open.</p><div class="actions"><button type="button" class="btn" data-drv="start">Connect Google Drive</button></div>';
}
function jobDriveFill(j){
  const box = document.getElementById("jobDrive"); if(!box) return;
  const show = d => { if(!document.getElementById("jobDrive")) return;
    if(!d || !d.folder){ box.innerHTML = '<p class="sub">No folder named Job ' + E(j._number) + ' that your Google account can open. The Job Folder Creator makes them.</p>'; return; }
    box.innerHTML = '<p class="sub"><a href="' + E(d.folder.link) + '" target="_blank" rel="noopener">' + E(d.folder.name) + '</a></p>' +
      (d.files.length ? '<ul class="drv">' + d.files.slice(0, 15).map(f => '<li><a href="' + E(f.link) + '" target="_blank" rel="noopener">' + E(f.name) + '</a><span class="sm">' + E(f.type) + ' · ' + E(showDate(f.modified)) + '</span></li>').join("") + '</ul>' : '<p class="sub">The folder is empty.</p>');
  };
  if(DRV.job[j._number]) return show(DRV.job[j._number]);
  driveStatus().then(st => {
    if(!st || !st.connected){ box.innerHTML = '<p class="sub">' + (st && st.ready ? 'Connect Google Drive under My account to see this job\'s folder here.' : 'Google Drive is not set up yet.') + '</p>'; return; }
    box.innerHTML = '<p class="sub">Looking in Drive…</p>';
    driveCall({ action:"job", number: j._number }).then(d => { DRV.job[j._number] = d; show(d); }).catch(e => { box.innerHTML = '<p class="sub">' + E(errCopy(e)) + '</p>'; });
  });
}
document.addEventListener("click", ev => {

});
(function(){

/* ---------- the command centre walkthrough ----------
   Built to the same house standard as the shop's walkthrough (public/tour.js):
   - it points at real parts of the screen through data-tour attributes
   - every step is spoken AND written on screen in the same words
   - the voice is on by default, the first step says so, and one press of
     "Stop the voice" keeps it quiet for the rest of the tour and the next one
   - two steps ask the person to do the thing, and neither can trap anybody:
     each lets go on its own after 45 seconds
   - a step whose part of the screen is not there for this person is skipped,
     and the chapter count adapts (Jen has no Field section, Amir has no Office)
   - it starts on its own once, the first time someone opens the command centre
     on a device, and only after the numbers have loaded
   Like the shop's tour, the voice is recorded clips (public/tour/cc), so it
   sounds the same, and natural, on every device. Change a line's words and its
   clip needs recording again; until then that line falls back to the device's
   own voice if its clip is missing. */
const CCTOUR = (function(){
  const SEEN = "am-command-tour-seen.v1", NEW_SEEN = "am-command-whatsnew-2026-11-17", MUTE = "am-command-tour-muted", RELEASE_MS = 45000;

     only marked seen in this browser, and only once it was finished or
     skipped, so closing the tab part way, another computer, or a browser that
     clears its storage brought it straight back. Now it is marked the moment
     it opens on its own, in this browser and on the account, so it opens on
     its own once per person. The Tour button still replays it any time. */
  function seenHere(k){ try{ return localStorage.getItem(k) === "1"; }catch(e){ return false; } }
  function seenOnAccount(k){ return !!(ME && ME.tours && ME.tours[ACCT[k]]); }
  const seen = k => seenHere(k) || seenOnAccount(k);
  function markSeen(...ks){
    ks.forEach(k => { try{ localStorage.setItem(k, "1"); }catch(e){} });
    if(VIEW_AS) return;
    const keys = ks.map(k => ACCT[k]).filter(Boolean), at = new Date().toISOString();
    ME.tours = ME.tours || {}; keys.forEach(k => { if(!ME.tours[k]) ME.tours[k] = at; });
    if(keys.length) acctCall("", { action:"tourSeen", keys }).catch(() => {});

        body:"Done, not billed lists every finished job that can't be invoiced yet, and why: a missing purchase order, a quote not approved, or a supplier bill still to come. Press Chase when someone owes us something. Your assistant drafts a note each day for three days, then tells you to pick up the phone." },
      { id:"md-closeout", clips:["md-closeout"], target:'[data-tour="as-closeout"]', at:"brief", when: () => !!AS.data && AS.data.role !== "exec", title:"Closeout",
        body:"Closeout keeps finished jobs on track for Thursday billing. Every purchase order, approved quote and subcontractor invoice goes into JobTread within seven days. Add a document from your phone and it lands in the job's Files in JobTread. Site photos go in Encircle." },
      { id:"md-done", clips:["md-done"], bookend:true, at:"brief", title:"That's My day",
        body:"That's it! Talk to it, tick things off, and read the check-ins. If something looks off, press the round Claude button and ask, or press Walk me through it to see this again." }
    ];
  }
  /* Cash flow, step by step. From the Walk me through it button on Cash flow. */
  function cashflowChapters(){
    return [
      { id:"cf-intro", clips:["cf-intro"], bookend:true, at:"cashflow", title:"Cash flow, step by step",
        body:"Hi" + (S.meName ? " " + S.meName : "") + "! This page is Craig's weekly cash flow sheet, kept up to date for you. Money owed to us and by us comes from QuickBooks. The planned payments, like payroll, WCB and loans, are kept here. Let's walk through it once." },
      { id:"cf-top", clips:["cf-top"], target:'[data-tour="cf-top"]', at:"cashflow", title:"Room on the line",
        body:"The first number is room on the line of credit right now: the newest bank balance plus the seven hundred and fifty thousand dollar overdraft. It moves each time you tick something received or paid. Type the balance from the bank right here whenever you want it exact. Next is where it ends this week, and where it ends four weeks out. The last one is: if everyone paid me today, and I paid everyone." },
      { id:"cf-ahead", clips:["cf-ahead"], target:'[data-tour="cf-ahead"]', at:"cashflow", when: () => !!document.querySelector('[data-tour="cf-ahead"]'), title:"Looking ahead",
        body:"Looking ahead shows the room left on the line at the end of each of the next thirteen weeks, one bar a week. Amber means the week ends under the reserve you keep. Red means it goes over the line. The sentence at the top names the first week it gets tight. The lighter bars further out only count what is known today, so add the billing you expect under Planned payments." },
      { id:"cf-advice", clips:["cf-advice"], target:'[data-tour="cf-advice"]', at:"cashflow", title:"What to do this week",
        body:"This is the plain advice. It finds the tightest week ahead and says what to pay now and what to hold, so the line never goes over and your reserve is kept every week." },
      { id:"cf-view", clips:["cf-view"], target:'[data-tour="cf-view"]', at:"cashflow", title:"This week, or four weeks",
        body:"Switch between this week, line by line, and all four weeks side by side. Tick a payment once it has gone out. Anything not ticked by the end of its week rolls into the next week, so nothing quietly disappears." },
      { id:"cf-plan", clips:["cf-plan"], target:'[data-tour="cf-plan"]', at:"cashflow", title:"Planned payments",
        body:"Open Planned payments to add, change or remove the regular lines: payroll, source deductions, WCB, insurance, loans. Lines marked Check were copied from the sheet and want a second look." },
      { id:"cf-done", clips:["cf-done"], bookend:true, at:"cashflow", title:"That's cash flow",
        body:"That's it! Glance at the top numbers, read the advice, and tick payments as they go. Ask Claude can go deeper, for example: what if a client pays a week late?" }
    ];
  }
  /* What's new, once, for anyone who already took the tour before these pages
     came in (November 2026). New people get the same steps in the full tour. */
  function whatsNewChapters(){
    return [
      { id:"new-intro", clips:["new-intro"], bookend:true, title:"What's new",
        body:"Hi" + (S.meName ? " " + S.meName : "") + "! A few new things have arrived in the command centre. This takes about a minute." },
      { id:"new-myday", clips:["myday"], target:'[data-tour="as-talk"]', at:"brief", title:"My day",
        body:"My day is your own assistant. It checks in at seven, at noon and at five with what needs you, keeps your hit list in order, and sorts your work inbox into reply drafts that you check and send yourself. It never sends anything on its own. Talk or type to it here. On an iPhone, tap the box and use the microphone on your keyboard. Walk me through it, on that page, shows you the rest." },
      { id:"new-notes", clips:["notes"], target:'[data-tour="nb-bar"]', at:"notes", title:"Sticky notes",
        body:"Sticky notes is your own board, so the paper notes can come off your monitor. Type a note or press Talk and say it, pick a colour, and it sticks to the board. Drag it anywhere, tap the words to change them, and Tidy up lines them all up." },
      { id:"new-cashflow", clips:["cashflow"], target:'[data-tour="cf-top"]', at:"cashflow", title:"Cash flow",
        body:"Cash flow follows Craig's weekly method: room on the line of credit now, money in and money out each week, and where it lands four weeks out. The advice underneath says what to pay and what to hold. Tick a payment once it goes out, and the weeks update." },
      { id:"new-queue", clips:["md-queue"], target:'[data-tour="as-queue"]', at:"brief", when: () => !!document.querySelector('[data-tour="as-queue"]'), title:"Needs you",
        body:"Needs you is your assistant's short list: only the emails you have to act on. Each one says what is being asked and has a reply drafted in your own words. Approve and send sends it from your own Gmail. Edit lets you change it first. Hand to passes it to someone else with a note, and puts a check on your list. Not mine takes it away, and This and others like it teaches your assistant for next time. Later brings it back tomorrow. Nothing is ever sent until you press the button." },
      { id:"new-cal", clips:["md-cal"], target:'[data-tour="as-cal"]', at:"brief", when: () => !!document.querySelector('[data-tour="as-cal"]'), title:"Your meetings",
        body:"Your meetings shows today's calendar, with anything that overlaps marked. Invites still waiting for your answer are at the top: press Accept, Maybe or Decline and the organizer is told." },
      { id:"new-ahead", clips:["cf-ahead"], target:'[data-tour="cf-ahead"]', at:"cashflow", when: () => !!document.querySelector('[data-tour="cf-ahead"]'), title:"Looking ahead",
        body:"Looking ahead shows the room left on the line at the end of each of the next thirteen weeks, one bar a week. Amber means the week ends under the reserve you keep. Red means it goes over the line. The sentence at the top names the first week it gets tight. The lighter bars further out only count what is known today, so add the billing you expect under Planned payments." },
      { id:"new-viewas", clips:["viewas"], target:'[data-ico="viewas"]', when: () => !!document.querySelector('[data-ico="viewas"]'), title:"View as",
        body:"View as shows you the command centre exactly as someone else sees it, so you can check their access or help them over the phone. It is look only: nothing can be saved, sent or changed. Their email stays private." },
      { id:"new-payroll", clips:["new-payroll"], target:'[data-tour="page"]', at:"payroll", title:"Payroll workbook",
        body:"Payroll now builds the workbook for Danielle: wages split by city and division, with overtime counted at time and a half, and expenses split the same way. Press Workbook for Danielle at the top." },
      { id:"new-done", clips:["new-done"], bookend:true, title:"That's what's new",
        body:"That's it! My day and Cash flow each have a Walk me through it button if you want the longer version. Enjoy!" }
    ];
  }
  let SET = "";
  let steps = [], i = 0, liveTour = false, muted = false, gateOk = true, gateOff = null, releaseTimer = null;
  const countable = () => steps.filter(s => !s.bookend);

  /* ---------- the voice ----------
     Every line is a recorded clip in public/tour/cc, in the same natural voice
     on every phone and computer. The words are in tools/Narration-Script-
     Command-Centre.md; tools/generate-narration.py turns them into the clips
     (Bruce's walkthrough kit, edge-tts, Andrew). A real recording can replace
     any clip by saving over the file of the same name.
     The words on screen can say the person's name; the clips do not, so they
     never need re-recording for a new person. A step whose words depend on the
     person (which sections they have) plays its clips one after another.
     If a clip will not load, that step falls back to the device's own voice.
     Browsers refuse sound until the person has touched the page once; when that
     happens the step waits and plays at their first click or key. */
  let queue = [], player = null, waitingForTouch = false;
  function deviceVoice(){
    try{
      const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      const rank = v => (/natural|neural|premium|enhanced|online/i.test(v.name) ? 0 : /google|siri|samantha|ava|aria|jenny|clara/i.test(v.name) ? 1 : 2) * 10 + (/en-CA/i.test(v.lang) ? 0 : /en-US/i.test(v.lang) ? 1 : 2);
      return vs.sort((a, b) => rank(a) - rank(b))[0] || null;
    }catch(e){ return null; }
  }
  function sayWithDevice(text){
    if(!text || !window.speechSynthesis) return;
    try{
      /* One sentence at a time: some browsers cut off a long line part way. */
      const v = deviceVoice();
      String(text).split(/(?<=[.!?])\s+/).forEach(t => { const u = new SpeechSynthesisUtterance(t); if(v) u.voice = v; u.rate = 0.95; speechSynthesis.speak(u); });
    }catch(e){}
  }
  function playNext(fallbackText){
    if(muted || !queue.length) return;
    const clip = queue[0];
    player = new Audio("tour/cc/" + clip + ".mp3");
    player.onended = () => { queue.shift(); playNext(fallbackText); };
    player.onerror = () => { queue = []; player = null; sayWithDevice(fallbackText); };
    const p = player.play();
    if(p && p.catch) p.catch(err => {
      if(err && err.name === "NotAllowedError"){
        if(waitingForTouch) return; waitingForTouch = true;
        const go = () => { ["pointerdown", "keydown"].forEach(ev => document.removeEventListener(ev, go, true)); waitingForTouch = false; if(!muted && queue.length) playNext(fallbackText); };
        ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, go, true));
      } else { queue = []; sayWithDevice(fallbackText); }
    });
  }
  function speak(step){
    hush();
    if(muted || !step) return;
    if(step.clips && step.clips.length){ queue = step.clips.slice(); playNext(step.body); }
    else sayWithDevice(step.body);
  }
  function hush(){
    queue = [];
    if(player){ try{ player.onended = null; player.onerror = null; player.pause(); }catch(e){} player = null; }
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  }
  function setMuted(v){
    muted = v; try{ localStorage.setItem(MUTE, v ? "1" : "0"); }catch(e){}
    if(v) hush(); else speak(steps[i]);
    paint();
  }

  /* ---------- the spotlight ---------- */
  function spot(el){
    const s = q("#ccSpot"); if(!s) return;
    if(!el){ s.style.display = "none"; return; }
    const r = el.getBoundingClientRect(), pad = 6;
    s.style.display = "block";
    s.style.top = (r.top - pad) + "px"; s.style.left = (r.left - pad) + "px";
    s.style.width = (r.width + pad * 2) + "px"; s.style.height = (r.height + pad * 2) + "px";
  }
  function place(el){
    const c = q("#ccCard"); if(!c) return;
    c.style.left = "50%"; c.style.transform = "translateX(-50%)";
    if(!el){ c.style.top = ""; c.style.bottom = "20px"; return; }
    const r = el.getBoundingClientRect();
    if(window.innerHeight - r.bottom > 280){ c.style.top = Math.max(r.bottom + 14, 10) + "px"; c.style.bottom = ""; }
    else if(r.top > 280){ c.style.bottom = (window.innerHeight - r.top + 14) + "px"; c.style.top = ""; }
    else { c.style.top = ""; c.style.bottom = "14px"; }
  }

  /* ---------- try-it steps ---------- */
  function clearGate(){ if(gateOff){ gateOff(); gateOff = null; } clearTimeout(releaseTimer); releaseTimer = null; }
  function armGate(step){
    clearGate();
    if(!step.gate){ gateOk = true; return; }
    gateOk = false;
    const pass = () => { if(!gateOk){ gateOk = true; paint(); } };
    /* Doing what the step asked moves the tour on by itself (2026-11-20).
       Before, pressing a step on the flow strip opened the job list under
       the tour's dark shade and only lit up Next, so people pressed and
       saw nothing happen. The next step is the one that shows what opened. */
    const did = () => { if(gateOk || !liveTour || steps[i] !== step) return; gateOk = true; clearGate(); show(i + 1, 1); };
    const h = e => { if(e.target && e.target.closest && e.target.closest(step.gate.click)) setTimeout(did, 350); };
    document.addEventListener("click", h, true);
    gateOff = () => document.removeEventListener("click", h, true);
    releaseTimer = setTimeout(pass, RELEASE_MS);   /* a nudge, never a lock */
  }

  /* ---------- drawing ---------- */
  function paint(){
    const step = steps[i]; if(!step) return;
    const el = step.target ? q(step.target) : null;
    spot(el); place(el);
    const total = countable().length, no = step.bookend ? 0 : countable().indexOf(step) + 1, last = i === steps.length - 1;
    q("#ccCard").innerHTML =
      '<div class="cct-head"><span class="cct-count">' + (no ? "Step " + no + " of " + total : (last ? "Done" : "Welcome")) + '</span>' +
      '<button class="cct-x" id="cctSkip" aria-label="Close the walkthrough" title="Close. It will not open on its own again. The Tour button at the top brings it back.">' + (last ? "Close" : "Close the tour") + ' <span aria-hidden="true">&times;</span></button></div>' +
      '<h3>' + E(step.title) + '</h3><p class="cct-body">' + E(step.body) + '</p>' +
      '<div class="cct-foot"><button class="cct-mute" id="cctMute">' + (muted ? "Play the voice" : "Stop the voice") + '</button>' +
      '<div class="cct-nav">' + (i > 0 ? '<button class="cct-back" id="cctBack">Back</button>' : '') +
      '<button class="cct-next" id="cctNext"' + (gateOk ? '' : ' disabled') + '>' + (last ? "Finish" : "Next") + '</button></div></div>' +
      (gateOk ? '' : '<div class="cct-wait">Go ahead and press it. The tour moves on by itself.</div>');
    q("#cctSkip").onclick = finish;
    q("#cctMute").onclick = () => setMuted(!muted);
    const b = q("#cctBack"); if(b) b.onclick = () => show(i - 1, -1);
    q("#cctNext").onclick = () => { if(gateOk) last ? finish() : show(i + 1, 1); };
  }
  function waitFor(sel, ms){
    return new Promise(res => {
      if(!sel || q(sel)) return res(true);
      const t0 = Date.now(), iv = setInterval(() => {
        if(q(sel)){ clearInterval(iv); res(true); }
        else if(Date.now() - t0 > (ms || 2000)){ clearInterval(iv); res(false); }
      }, 120);
    });
  }
  async function show(n, dir){
    if(n < 0) n = 0;
    if(n >= steps.length) return finish();
    i = n; const step = steps[i];
    if(!step.keepDrawer && drawerState) closeDrawer();
    if(step.at && current !== step.at && CFG.tabs.includes(step.at)) go(step.at);
    if(step.target){
      /* My day and Cash flow read live data first; give them longer to appear. */
      const there = await waitFor(step.target, step.at === "brief" || step.at === "cashflow" || step.at === "notes" ? 8000 : 2000);
      /* Not on this person's screen: move on in the direction they were going. */
      if(!there) return show(n + (dir || 1), dir || 1);
      const el = q(step.target);
      if(el && step.target !== "#drawer" && step.target !== "#secs" && step.target !== "#tabs") el.scrollIntoView({ block:"center" });
      await new Promise(r => setTimeout(r, 200));
    }
    armGate(step); speak(step); paint();
  }

  /* ---------- start and stop ---------- */
  function start(set){
    if(liveTour) return;
    liveTour = true; SET = set || "";
    try{ muted = localStorage.getItem(MUTE) === "1"; }catch(e){ muted = false; }
    const BY = { payroll: payrollChapters, myday: mydayChapters, cashflow: cashflowChapters, whatsnew: whatsNewChapters };
    steps = (BY[SET] || chapters)().filter(s => (!s.at || CFG.tabs.includes(s.at)) && (!s.when || s.when()));
    /* A short set with nothing left for this person but its bookends is not worth showing. */
    if(SET === "whatsnew" && !steps.some(s => !s.bookend)){ liveTour = false; SET = ""; markSeen(NEW_SEEN); return; }
    if(!q("#ccTour")){
      const d = document.createElement("div"); d.id = "ccTour";
      d.innerHTML = '<div id="ccSpot"></div><div id="ccCard" role="dialog" aria-live="polite" aria-label="Walkthrough"></div>';
      document.body.appendChild(d);
    }
    document.body.classList.add("cct-on");
    show(0, 1);
  }
  function finish(){
    liveTour = false; clearGate(); hush();
    const d = q("#ccTour"); if(d) d.remove();
    document.body.classList.remove("cct-on");
    if(drawerState) closeDrawer();
    const home = { payroll:"payroll", myday:"brief", cashflow:"cashflow" }[SET];
    if(!home) markSeen(SEEN, NEW_SEEN);
    go(home && CFG.tabs.includes(home) ? home : (CFG.tabs.includes("brief") && ME.landing === "brief" ? "brief" : "overview")); SET = "";
  }
  window.addEventListener("resize", () => { if(liveTour) paint(); });
  window.addEventListener("scroll", () => { if(liveTour) paint(); }, true);
  document.addEventListener("keydown", e => { if(liveTour && e.key === "Escape") finish(); });
  /* The page redraws itself every few minutes. Put the spotlight back on top. */
  const keep = new MutationObserver(() => { if(liveTour) requestAnimationFrame(paint); });
  const watchMain = () => { const m = q("#main"); if(m) keep.observe(m, { childList:true }); };
  if(q("#main")) watchMain(); else document.addEventListener("DOMContentLoaded", watchMain);

  return {
    start,
    ready(){
      if(VIEW_AS || liveTour) return;
      /* Seen on the account but not in this browser: copy it here and stay shut. */
      [SEEN, NEW_SEEN].forEach(k => { if(seenOnAccount(k) && !seenHere(k)) try{ localStorage.setItem(k, "1"); }catch(e){} });
      if(!seen(SEEN)){ markSeen(SEEN, NEW_SEEN); return start(); }
      if(!seen(NEW_SEEN)){ markSeen(NEW_SEEN); return start("whatsnew"); }
    },
    replay(){ try{ localStorage.removeItem(SEEN); }catch(e){} start(); },
    payroll(){ start("payroll"); },
    walk(set){ start(set); }
  };
})();

start();
</script>
