<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A&M Office Command Centre</title>
<style>
:root{
  --ink:#1a1917; --ink-2:#4a4844; --ink-3:#77746d;
  --rule:#ddd9d2; --rule-soft:#eae7e1;
  --ground:#f4f3ef; --panel:#fff; --panel-2:#faf9f6; --bar:#1a1917; --bar-ink:#f4f3ef; --bar-3:#9a968e;
  --cyan:#329dbb; --cyan-deep:#1f7691; --cyan-wash:#e6f2f6;
  --stop:#b3341f; --stop-wash:#fbeeeb;
  --caution:#a86c0e; --caution-wash:#fcf3e3;
  --clear:#3f7d4e; --clear-wash:#ecf4ed;
  --shadow:0 1px 2px rgba(26,25,23,.05), 0 8px 24px -16px rgba(26,25,23,.28);
  --scrim:rgba(26,25,23,.38);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#f2efe9; --ink-2:#b8b3aa; --ink-3:#8b867d;
  --rule:#33312d; --rule-soft:#282622;
  --ground:#121110; --panel:#1c1b19; --panel-2:#211f1d; --bar:#0b0b0a; --bar-ink:#f2efe9; --bar-3:#8b867d;
  --cyan:#5cc0dc; --cyan-deep:#8ad5ea; --cyan-wash:#12333d;
  --stop:#e8735a; --stop-wash:#3a1c16;
  --caution:#e0a445; --caution-wash:#382a12;
  --clear:#77bd87; --clear-wash:#1a2e1f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#f2efe9; --ink-2:#b8b3aa; --ink-3:#8b867d;
  --rule:#33312d; --rule-soft:#282622;
  --ground:#121110; --panel:#1c1b19; --panel-2:#211f1d; --bar:#0b0b0a; --bar-ink:#f2efe9; --bar-3:#8b867d;
  --cyan:#5cc0dc; --cyan-deep:#8ad5ea; --cyan-wash:#12333d;
  --stop:#e8735a; --stop-wash:#3a1c16;
  --caution:#e0a445; --caution-wash:#382a12;
  --clear:#77bd87; --clear-wash:#1a2e1f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0}
a{color:var(--cyan-deep)}
button{font:inherit;color:inherit}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.top .in{max-width:1240px;margin:0 auto;padding-block:12px;padding-left:20px;padding-right:20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.mark{display:flex;align-items:baseline;gap:8px;flex:none}
.mark .am{font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
.mark .am b{color:var(--cyan)}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:0 1 auto;padding-left:16px;border-left:1px solid #3a3834}
.who b{font-size:15px;font-weight:700}
.who span{font-size:11px;color:var(--bar-3)}
.find{position:relative;flex:1 1 240px;min-width:0;max-width:420px;margin-left:auto}
.find input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:3px;border:1px solid #3a3834;
  background:#262522;color:var(--bar-ink)}
.find input::placeholder{color:var(--bar-3)}
.find input:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
.hits{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);color:var(--ink);border:1px solid var(--rule);
  border-radius:3px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule-soft);padding:9px 12px;cursor:pointer}
.hits button:first-child{border-top:0}
.hits button:hover,.hits button:focus{background:var(--cyan-wash);outline:none}
.hits small{display:block;color:var(--ink-3);font-size:12px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bar-3);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bar-3);flex:none}
.dot.ok{background:#77bd87}.dot.warn{background:#e0a445}.dot.bad{background:#e8735a}
.refresh{font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--bar-ink);
  border:1px solid #4a4844;border-radius:3px;padding:7px 12px}
.refresh:hover{border-color:var(--cyan)}
.refresh[disabled]{opacity:.5;cursor:default}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;flex:none}
.tools .live{margin-right:6px}

/* post mortem */
.pm-back{margin-bottom:10px}
.pm-meta .pm-grid3{display:grid;gap:10px 16px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.pm-meta input,.pm-meta select,.pm-stand input,.pm-keep input,.pm-crow input,.pm-crow select,.pm-any input,.pm-learn textarea,.pm-in input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.pm-learn textarea{resize:vertical}
.pm-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.pm-chips .sub{margin:0 4px 0 0}
.pm-chip{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--panel-2);color:var(--ink-2);cursor:pointer}
.pm-chip:hover{border-color:var(--cyan)}
#pmForm .card{margin-bottom:16px}
.pm-total .pm-tot{display:grid;gap:12px 28px;grid-template-columns:minmax(0,220px) minmax(0,1fr);align-items:center}
.pm-total .k,.pm-keep .k,.pm-commit .k,.pm-facts .k{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.big small{font-size:15px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.pm-bars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.pm-bars li{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.pm-bars .track{height:10px;background:var(--rule-soft);border-radius:5px;overflow:hidden}
.pm-bars .fill{display:block;height:100%;background:var(--cyan)}
.pm-bars .fill.low{background:var(--caution)}
.pm-bars .num{text-align:right;font-weight:700}
.pm-fig{width:100%}
.pm-fig th[scope="row"]{text-align:left;font-weight:600;white-space:nowrap}
.pm-src{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);font-family:inherit;white-space:nowrap}
.pm-src.typed{color:var(--caution)}
.pm-src.none{color:var(--ink-3);font-style:italic}
.pm-pct th[scope="row"] .pm-src{white-space:normal;max-width:300px}
.pm-sum th,.pm-sum td{border-top:2px solid var(--rule)}
.pm-bad{color:var(--stop)!important}
.pm-in{width:150px}
.pm-in input{padding:5px 8px;font-size:13px}
.pm-facts{display:grid;gap:10px 18px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));margin:14px 0;padding:12px 14px;background:var(--panel-2);border-radius:3px}
.pm-facts .num{font-size:15px;font-weight:700}
.pm-facts small{font-weight:500;font-size:12px;color:var(--ink-3)}
.pm-scores{margin-top:16px;border-top:1px solid var(--rule-soft);padding-top:14px}
.pm-sh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.pm-sec{font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.pm-sec small{font-size:12px;color:var(--ink-3)}
.pm-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.pm-q{font-size:14px;color:var(--ink)}
.pm-btns{display:flex;gap:4px;flex-wrap:wrap}
.pm-n{font:inherit;font-size:13px;font-weight:700;width:34px;height:34px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.pm-n:hover{border-color:var(--ink-3)}
.pm-n.on.lo{background:var(--stop);border-color:var(--stop);color:#fff}
.pm-n.on.mid{background:var(--caution);border-color:var(--caution);color:#fff}
.pm-n.on.hi{background:var(--clear);border-color:var(--clear);color:#fff}
.pm-learn{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);margin-top:12px}
.pm-stand{margin:6px 0 4px}
.pm-keep,.pm-commit{display:grid;gap:8px;margin-bottom:16px}
.pm-crow{display:grid;grid-template-columns:110px minmax(0,1fr) 150px 150px auto auto;gap:6px;align-items:center}
.pm-done{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-2);margin:6px 0;line-height:1.4}
.pm-done input{margin-top:3px;flex:none}
.pm-crow .pm-done{white-space:nowrap;align-items:center;margin:0}
.pm-crow .pm-done input{margin-top:0}
.pm-crow input[type=checkbox]{width:auto}
.pm-finish .actions{margin-top:10px}
.pm-miss{margin:10px 0 0;font-size:13px}
.pm-any{display:flex;gap:8px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.pm-any .fld{flex:1 1 260px}
/* read-only post mortem */
.pm-ro{border:0;margin:0;padding:0;min-width:0}
/* Admin: People and access */
.ac-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ac-head h2{margin:0}
.ac-chips .tag{margin:0 3px 3px 0}
tr.ac-off td{opacity:.55}
tr[data-ac-edit]:hover td{background:var(--panel-2)}
.ac-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.ac-row .fld{flex:1 1 220px}
.ac-form .fld{margin-bottom:12px}
.ac-form .fld input[type=text],.ac-form .fld input[type=email],.ac-form .fld input[type=password]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
.ac-form .fld input:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:var(--cyan)}
.ac-set{border:0;margin:0 0 14px;padding:0;min-width:0}
.ac-set legend{font-size:12px;color:var(--ink-2);padding:0;margin-bottom:6px}
.ac-seg{display:flex;flex-wrap:wrap;gap:6px}
.ac-seg label{position:relative;cursor:pointer}
.ac-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ac-seg span{display:inline-block;font-size:13px;font-weight:700;padding:7px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink-2)}
.ac-seg input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.ac-seg input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:1px}
.ac-check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:13px;line-height:1.4;color:var(--ink-2);cursor:pointer}
.ac-check input{margin:2px 0 0;flex:none;width:16px;height:16px;accent-color:var(--cyan-deep)}
.ac-check b{color:var(--ink);margin-right:4px}
.ac-check input:disabled+span{opacity:.5}
.ac-more{margin-top:8px;padding-top:4px;border-top:1px solid var(--rule)}
.ac-more h3{margin:14px 0 4px}
.ac-facts{margin-top:18px}
.ac-sub{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 4px}
.ac-temp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--panel-2);border:1px solid var(--rule);border-left:4px solid var(--cyan);border-radius:3px;margin-bottom:12px}
.ac-temp .k{flex:1 1 100%;font-size:12px;color:var(--ink-3)}
.ac-temp code{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--ink);user-select:all}

.pm-clist{list-style:none;margin:0;padding:0}
.pm-clist li{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.pm-clist .sm{font-size:12px;color:var(--ink-3);padding-left:22px}
@media (max-width:700px){
  .pm-total .pm-tot{grid-template-columns:1fr}
  .pm-bars li{grid-template-columns:minmax(0,1fr) 90px 36px}
  .pm-line{grid-template-columns:1fr}
  .pm-btns{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
  .pm-n{width:auto;min-width:0;height:34px;font-size:12.5px}
  .pm-crow{grid-template-columns:1fr 1fr}
  .pm-crow input[data-c$=":what"]{grid-column:1/-1;order:-1}
  .pm-in{width:110px}
}

/* walkthrough: the same look as the shop's, in the command centre's colours */
#ccTour{position:fixed;inset:0;z-index:200;pointer-events:none}
#ccSpot{position:fixed;border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(26,25,23,.62);
  outline:3px solid var(--cyan);outline-offset:2px;transition:top .18s ease,left .18s ease,width .18s ease,height .18s ease}
#ccCard{position:fixed;pointer-events:auto;width:min(460px,calc(100vw - 28px));background:var(--panel);color:var(--ink);
  border-radius:14px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:4px solid var(--cyan)}
#ccCard h3{margin:6px 0 8px;font-size:18px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.cct-head{display:flex;justify-content:space-between;align-items:center}
.cct-count{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.cct-x{background:none;border:0;color:var(--ink-3);cursor:pointer;font:inherit;font-size:13px;padding:4px}
.cct-body{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.cct-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.cct-nav{display:flex;gap:8px}
.cct-mute{background:none;border:0;color:var(--ink-3);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}
.cct-back{background:var(--panel);border:1px solid var(--rule);color:var(--ink-2);border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;font-size:14px}
.cct-next{background:var(--ink);border:0;color:var(--panel);border-radius:8px;padding:9px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cct-next[disabled]{opacity:.35;cursor:not-allowed}
.cct-wait{margin-top:10px;font-size:12.5px;color:var(--ink-2);background:var(--cyan-wash);padding:8px 10px;border-radius:8px}
@media (max-width:480px){#ccCard{width:calc(100vw - 20px);padding:15px}.cct-body{font-size:14px}}

/* tabs */
.tabsWrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,62px));z-index:15;background:var(--panel);border-bottom:1px solid var(--rule)}
.secs{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);
  color:var(--ink-2);font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.sec:hover{border-color:var(--ink-3);color:var(--ink)}
.sec[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
@media (max-width:480px){.secs{gap:5px;padding:8px 12px;flex-wrap:wrap;overflow-x:visible}.sec{padding:6px 10px;font-size:13.5px;gap:5px}.sec .badge{min-width:16px;padding:0 4px;font-size:10px}}
.sec[aria-current="true"] .badge:not(.stop):not(.caution){background:var(--ink-2);color:var(--panel)}
.tabs{max-width:none;margin:0;padding-left:max(20px, calc((100% - 1200px) / 2));padding-right:20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;
  background:var(--panel-2);border-top:1px solid var(--rule-soft)}
.tab{position:relative;background:none;border:0;border-bottom:3px solid transparent;padding:13px 10px 11px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
a.tab{text-decoration:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cyan)}
.badge{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;min-width:20px;padding:1px 6px;border-radius:10px;
  text-align:center;background:var(--rule-soft);color:var(--ink-3)}
.badge.stop{background:var(--stop);color:#fff}
.badge.caution{background:var(--caution-wash);color:var(--caution)}

/* content */
main{max-width:1240px;margin:0 auto;padding-block:22px 72px;padding-left:20px;padding-right:20px}
.tabhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.tabhead h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.tabhead p{margin:0;font-size:13px;color:var(--ink-3);flex:1 1 320px}
.verdict{padding:15px 18px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--ink-3);border-radius:3px;box-shadow:var(--shadow);margin-bottom:16px}
.verdict.stop{border-left-color:var(--stop)}.verdict.caution{border-left-color:var(--caution)}.verdict.clear{border-left-color:var(--clear)}
.verdict p{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.verdict .meta{margin-top:4px;font-size:13px;color:var(--ink-3)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr))}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.card .lede{margin:0 0 12px;font-size:13px;color:var(--ink-3)}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.big.stop{color:var(--stop)}.big.caution{color:var(--caution)}.big.clear{color:var(--clear)}
.sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.sub:last-child{margin-bottom:0}

/* kpis */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));grid-auto-rows:1fr;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;min-width:0;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  /* Every tile lines up: label, number and note start at the same height on every tile in the row,
     whether the label takes one line or two. A button centres its content unless told otherwise. */
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;height:100%;font:inherit;color:inherit}
.kpi:hover{border-color:var(--cyan)}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);line-height:1.35;min-height:2.7em}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.kpi .v.stop{color:var(--stop)}.kpi .v.caution{color:var(--caution)}.kpi .v.clear{color:var(--clear)}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:3px}

/* flow strip */
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-bottom:16px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);overflow:hidden}
.flow button{background:none;border:0;border-left:1px solid var(--rule-soft);padding:14px 12px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;font:inherit;color:inherit}
.flow button:first-child{border-left:0}
.flow button:hover{background:var(--cyan-wash)}
.flow .n{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.flow .l{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}

    <div class="find" data-tour="find">
      <input id="find" type="search" placeholder="Find a job by number, name, client or address" autocomplete="off" aria-label="Find a job">
      <div class="hits" id="hits" hidden></div>
    </div>
    <div class="tools" data-tour="tools"><div class="live"><span class="dot" id="conndot"></span><span id="connlabel">Connecting</span></div>
    <button class="refresh" id="refresh" data-ico="refresh" aria-label="Refresh" disabled>Refresh</button></div>
  </div>
</header>
<div class="tabsWrap"><nav class="secs" id="secs" aria-label="Sections"></nav><nav class="tabs" id="tabs" role="tablist" aria-label="Pages in this section" hidden></nav></div>
<main id="main"><div class="state">Opening the command centre.</div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dtitle">
  <header><h2 id="dtitle"></h2><button class="x" id="dclose" aria-label="Close">&times;</button></header>
  <div class="body" id="dbody"></div>
</aside>
<script>
/* A&M command centre. One source, three pages: Craig, the office (Jen) and the field (Amir).
   Reads live from JobTread, QuickBooks and Gmail through the viewer's own connections.
   It stores nothing and changes nothing. Every "change" button opens the owning system. */
let ROLE = "office";
const PLATFORM = "app";   /* "claude" for the Claude pages, "app" inside the A&M app */
const ORG = "22PRQFH4cHFm";
const JT = "JobTread", QB = "Intuit QuickBooks", GM = "Gmail";
const FY_START = "2026-04-01";
const YEAR_SALES = 8000000; /* roughly what A&M does in a year, for the pace line only */

const ROLES = {
  craig:  { title:"Craig's command centre", who:"Every section of A&M in one place",
            tabs:["overview","estimating","dispatch","money","buying","records","projects","sites","closeout","equipment","drafts"], qb:true, gmail:true },
  office: { title:"Office command centre", who:"Estimating, dispatch, money and records",
            tabs:["overview","estimating","dispatch","money","buying","records"], qb:true, gmail:false },
  field:  { title:"Field command centre", who:"Projects, sites, closeout and equipment",
            tabs:["overview","projects","sites","closeout","equipment"], qb:false, gmail:false }
};
const TABS = {
  overview:  { label:"Overview",     group:"" },
  estimating:{ label:"Estimating",   group:"Office" },
  dispatch:  { label:"Dispatch",     group:"Office" },
  money:     { label:"Money",        group:"Office" },
  buying:    { label:"Buying",       group:"Office" },
  records:   { label:"Records",      group:"Office" },
  projects:  { label:"Projects",     group:"Field" },
  sites:     { label:"Sites",        group:"Field" },
  closeout:  { label:"Closeout",     group:"Field" },
  postmortem:{ label:"Post mortem",  group:"Field" },
  payroll:   { label:"Payroll",      group:"Office" },
  equipment: { label:"Equipment",    group:"Field" },
  drafts:    { label:"To send", group:"Assistants" },
  people:    { label:"People and access", group:"Admin" },
  connections:{ label:"Connections",     group:"Admin" }
};
/* Inside the app: whether this person's account can change anything (set by an admin). */
let CAN_EDIT = true;
let CFG = ROLES[ROLE] || ROLES.craig;

/* JobTread status list, read from JobTread on 2026-10-06. Twenty five values.
   If JobTread gains or renames a status, the Records tab names it instead of skipping it. */
const STAGES = [
  { key:"lead",  label:"New leads",       statuses:["New Lead","Uploaded Without Plans","Uploaded With Plans"] },
  { key:"est",   label:"Being estimated", statuses:["Estimating","Site Visit Scheduled","Pending Estimate Review","Estimate Review Completed"] },
  { key:"out",   label:"Quote out",       statuses:["Estimate Sent","Pending","Follow Up Required"] },
  { key:"won",   label:"Won, no date",    statuses:["Bid Accepted","Upcoming To Be Scheduled","Scheduling required"] },
  { key:"sched", label:"Scheduled",       statuses:["Scheduled (Date promised)","Turnover Meeting Required","NOP"] },
  { key:"site",  label:"On site",         statuses:["Site work"] },
  { key:"close", label:"Closing out",     statuses:["Loose Ends Required","Job Complete by A&M","PM Approvals","Invoicing","Job Post Mortem"] }
];
const DONE = ["Closed Won","Not Bid","File Closed Bid Lost"];
const ALLSTATUS = STAGES.flatMap(s => s.statuses).concat(DONE);
const PRE = STAGES.slice(0,3).flatMap(s => s.statuses);
const POST = STAGES.slice(3).flatMap(s => s.statuses);
const stageOf = s => { for(const g of STAGES) if(g.statuses.includes(s)) return g.key; return DONE.includes(s) ? "done" : "unknown"; };

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const E = s => String(s === undefined || s === null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const M = v => (v === null || v === undefined || isNaN(v)) ? "n/a" : (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-CA");
const MK = v => {
  if(v === null || v === undefined || isNaN(v)) return "n/a";
  const a = Math.abs(v), s = v < 0 ? "-$" : "$";
  if(a >= 1e6) return s + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
  if(a >= 1e4) return s + Math.round(a/1e3) + "k";
  return s + Math.round(a).toLocaleString("en-CA");
};
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const F = v => Array.isArray(v) ? v[0] : v;
const ALL = v => v === undefined || v === null ? [] : (Array.isArray(v) ? v : [v]);
function dOnly(s){
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function daysTo(s){ const d = dOnly(s); if(!d) return null; return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today()) / 86400000); }
function daysSince(s){ const v = daysTo(s); return v === null ? null : -v; }
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function showDate(s){ const d = dOnly(s); return d ? iso(d) : ""; }
function showWhen(s){
  const d = dOnly(s); if(!d) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return iso(d);
  return iso(d) + " " + d.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit",timeZone:"America/Edmonton"});
}
function rel(n, past, future){
  if(n === null) return "No date";
  if(n === 0) return "Today";
  if(n === 1) return future ? "Tomorrow" : "In 1 day";
  if(n === -1) return "Yesterday";
  return n > 0 ? "In " + n + " days" : (-n) + " days ago";
}
function store(k, v){ try{ if(v === undefined) return localStorage.getItem("am." + k); localStorage.setItem("am." + k, v); }catch(e){ return null; } }

/* ---------- job helpers ---------- */
const st = j => F(j["Status"]) || "No status";
const pm = j => F(j["Project Manager"]) || "";
const types = j => ALL(j["Job Type"]);
const startOf = j => F(j["Expected Date of Project Start"]) || "";
const risk = j => F(j["Risk Level"]) || "";
const isAsb = j => types(j).join(" ").toLowerCase().includes("asbestos") || ["Low Risk","Moderate Risk","High Risk","Glovebag"].includes(risk(j));
const crew = j => { const v = parseFloat(F(j["Number of Guys Required"])); return isNaN(v) ? null : v; };
const dur = j => { const v = parseFloat(F(j["Estimated Days of Work"])); return isNaN(v) ? null : v; };
const isOpen = j => !j._closed && !DONE.includes(st(j));
const isSpecial = j => /^99-/.test(j._number || "") || /^test\b/i.test(j._name || "") || /\(overhead\)/i.test(j._name || "") || /^office work$/i.test(j._name || "");
const live = () => (S.jobs || []).filter(j => isOpen(j) && !isSpecial(j));
const jtUrl = id => "https://app.jobtread.com/jobs/" + encodeURIComponent(id);
function jobCell(j){
  return '<span class="nm">' + E(j._number) + ' ' + E(j._name) + '</span><span class="sm">' + E(j._cust || j._addr || "") + '</span>';
}
function stTag(j){
  const g = stageOf(st(j));
  const cls = g === "unknown" ? "stop" : (g === "close" ? "caution" : "mute");
  return '<span class="tag ' + cls + '">' + E(st(j)) + '</span>';
}
let tblN = 0; const EXPANDED = {};
function tbl(head, rows, empty, limit){
  const id = current + ":" + (++tblN);
  if(!rows.length) return '<div class="state ok">' + E(empty || "Nothing here right now.") + '</div>';
  const lim = EXPANDED[id] ? rows.length : (limit || 12);
  const shown = rows.slice(0, lim);
  return '<div class="scroll"><table><thead><tr>' + head + '</tr></thead><tbody>' + shown.join("") + '</tbody></table></div>' +
    (rows.length > lim ? '<div class="more">Showing ' + lim + ' of ' + rows.length + '. <button class="go" data-expand="' + E(id) + '">Show all ' + rows.length + '</button></div>' : "");
}
function bars(list, onclick){
  const max = Math.max(0, ...list.map(x => x[1]));
  if(!max) return '<div class="state">Nothing to show.</div>';
  return '<ul class="bars">' + list.map(x =>
    '<li' + (x[2] ? ' class="click" data-list="' + E(x[2]) + '"' : '') + '><span>' + E(x[0]) + '</span><span class="num">' + (x[3] || x[1]) + '</span>' +
    '<span class="track"><span class="fill" style="width:' + Math.max(2, Math.round(x[1]/max*100)) + '%"></span></span></li>').join("") + '</ul>';
}
function wait(what){ return '<div class="state loading"><span class="dots">Reading ' + E(what) + '</span></div>'; }
function errCopy(e){
  const c = e && e.code;
  if(c === "server_not_connected") return "That system is not connected for you yet. Connect it in Claude, then press Refresh.";
  if(c === "needs_reauth") return "Your sign in to that system has run out. Sign in again, then press Refresh.";
  if(c === "not_granted" || c === "capability_disabled" || c === "not_in_manifest") return "This page has not been allowed to read that system. Allow it when asked, then press Refresh.";
  if(c === "approval_required") return "This read is waiting for you to approve it.";
  if(c === "rate_limited") return "That system is busy. Press Refresh in a minute.";
  if(c === "not_connected" || c === "role" || c === "upstream" || c === "auth") return (e && e.message) ? String(e.message) : "That read did not come back.";
  return (e && e.message) ? String(e.message) : "That read did not come back.";
}
function failBox(e, what){ return '<div class="state err">' + E(what ? what + ": " : "") + E(errCopy(e)) + '</div>'; }

/* ---------- state ---------- */
const S = { mcp:null, jobs:null, jobTotal:null, jobsShort:false, jobsErr:null, stamp:null,
            orders:null, ordersErr:null, bs:null, bsErr:null, ar:null, arErr:null, ap:null, apErr:null,
            pl:null, plErr:null, drafts:null, draftsErr:null, draftsMore:false };
let unsubs = [];
let current = null;

function flat(job){
  const o = {};
  const n = (job.customFieldValues && job.customFieldValues.nodes) || [];
  for(const x of n){
    const k = x.customField && x.customField.name; if(!k) continue;
    if(o[k] === undefined) o[k] = x.value;
    else if(Array.isArray(o[k])) o[k].push(x.value);
    else o[k] = [o[k], x.value];
  }
  o._id = job.id; o._name = job.name; o._number = job.number;
  o._created = job.createdAt; o._closed = job.closedOn;
  o._addr = (job.location && job.location.address) || "";
  o._cust = (job.location && job.location.account && job.location.account.name) || "";
  return o;
}

/* JobTread hands back 100 jobs at a time with a token for the next lot.
   The page walks every lot and checks what it got against the total JobTread reports,
   so a short read is said out loud instead of quietly undercounting. */
function grabJobs(token, acc){
  const args = { size:100 }; if(token) args.page = token;
  return S.mcp.callTool(JT, "query", { query:{ organization:{ "$":{ id:ORG },
      jobs:{ "$":args, count:{}, nextPage:{}, nodes:{
        id:{}, name:{}, number:{}, createdAt:{}, closedOn:{},
        location:{ address:{}, account:{ name:{} } },
        customFieldValues:{ "$":{ size:100 }, nodes:{ value:{}, customField:{ name:{} } } }
      } } } } }, { cache:{ staleTime:120000 } })
  .then(res => {
    const jb = res && res.payload && res.payload.organization && res.payload.organization.jobs;
    if(!jb || !jb.nodes) throw { code:"tool_error", message:"JobTread did not return a job list." };
    acc.rows = acc.rows.concat(jb.nodes);
    if(acc.total === null && typeof jb.count === "number") acc.total = jb.count;
    if(acc.stamp === null) acc.stamp = res.cache && res.cache.storedAt;
    if(jb.nextPage && acc.rows.length < 5000) return grabJobs(jb.nextPage, acc);
    return acc;
  });
}
/* Quotes built in JobTread are "customer order" documents: draft, pending, approved or denied. */
function grabOrders(token, acc){
  const args = { size:100, where:["type","customerOrder"] }; if(token) args.page = token;
  return S.mcp.callTool(JT, "query", { query:{ organization:{ "$":{ id:ORG },
      orders:{ "_":"documents", "$":args, nextPage:{}, nodes:{
        id:{}, name:{}, status:{}, price:{}, issueDate:{}, createdAt:{}, job:{ id:{} }
      } } } } }, { cache:{ staleTime:120000 } })
  .then(res => {
    const d = res && res.payload && res.payload.organization && res.payload.organization.orders;
    if(!d || !d.nodes) throw { code:"tool_error", message:"JobTread did not return its quotes." };
    acc = acc.concat(d.nodes);
    if(d.nextPage && acc.length < 5000) return grabOrders(d.nextPage, acc);
    return acc;
  });
}
function grabDrafts(token, acc, pages){
  const args = { pageSize:50, view:"DRAFT_VIEW_FULL" }; if(token) args.pageToken = token;
  return S.mcp.callTool(GM, "list_drafts", args, { cache:{ staleTime:120000 } }).then(res => {
    const p = (res && res.payload) || {};
    acc = acc.concat(p.drafts || []);
    if(p.nextPageToken && pages < 3) return grabDrafts(p.nextPageToken, acc, pages + 1);
    S.draftsMore = !!p.nextPageToken;
    return acc;
  });
}

function loadAll(){
  unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
  grabJobs(null, { rows:[], total:null, stamp:null }).then(acc => {
    S.jobs = acc.rows.map(flat); S.jobTotal = acc.total; S.stamp = acc.stamp; S.jobsErr = null;
    S.jobsShort = acc.total !== null && acc.rows.length < acc.total;
    render();
  }).catch(e => { S.jobsErr = e; render(); });
  grabOrders(null, []).then(o => { S.orders = o; S.ordersErr = null; render(); })
    .catch(e => { S.ordersErr = e; render(); });

  if(CFG.qb){
    const today_ = iso(new Date());
    const watch = (tool, input, key, opts) => unsubs.push(S.mcp.watchTool(QB, tool, input, ev => {
      if(ev.type === "error"){ S[key + "Err"] = ev.error; if(["not_granted","needs_reauth","server_not_connected"].includes(ev.error && ev.error.code)) S.M[key] = null; render(); return; }
      const p = ev.result && ev.result.payload;
      if(!p){ S[key + "Err"] = { code:"tool_error", message:"That report came back empty." }; render(); return; }
      S.M[key] = key === "bs" ? normBS(p) : key === "pl" ? normPL(p) : agingOf(p);
      S[key + "Err"] = null; render();
    }, opts));
    /* QuickBooks wants the connection checked before any report. */
    S.mcp.callTool(QB, "company_info", {}, { cache:{ staleTime:300000 } }).catch(() => {}).then(() => {
      watch("qbo_accounting_get_balance_sheet", { start_date:today_, end_date:today_ }, "bs", { cache:{ staleTime:180000 }, refetchInterval:600000 });
      watch("qbo_accounting_get_ar_aging_summary", {}, "ar", { cache:{ staleTime:180000 }, refetchInterval:600000 });
      watch("qbo_accounting_get_ap_aging_summary", {}, "ap", { cache:{ staleTime:180000 }, refetchInterval:600000 });
      watch("profit_loss_quickbooks_account", { periodStart:FY_START, periodEnd:today_ }, "pl", { cache:{ staleTime:300000 }, refetchInterval:900000 });
    });
  }
  if(CFG.tabs.includes("buying")) loadBuyingClaude();
  if(CFG.gmail){
    grabDrafts(null, [], 0).then(d => { S.drafts = d; S.draftsErr = null; render(); })
      .catch(e => { S.draftsErr = e; render(); });
  }
}

/* ---------- each tab registers: render() -> html, alerts() -> [{lvl,text,meta,tab}] ---------- */
const VIEWS = {};
const LV = { stop:0, caution:1, info:2 };
function alertsFor(tab){
  try{ return (VIEWS[tab] && VIEWS[tab].alerts) ? VIEWS[tab].alerts().map(a => Object.assign({ tab }, a)) : []; }
  catch(e){ return []; }
}
function verdictHtml(list, calm, calmMeta){
  const a = list.slice().sort((x, y) => LV[x.lvl] - LV[y.lvl]);
  if(!a.length) return '<div class="verdict clear"><p>' + ico("clear") + '<span>' + E(calm) + '</span></p>' + (calmMeta ? '<div class="meta">' + E(calmMeta) + '</div>' : '') + '</div>';
  const top = a[0];
  return '<div class="verdict ' + top.lvl + '"><p>' + ico(top.lvl === "stop" ? "stop" : top.lvl === "caution" ? "caution" : "info") + '<span>' + E(top.text) + '</span></p><div class="meta">' + E(top.meta || "") +
    (a.length > 1 ? (top.meta ? " " : "") + plural(a.length - 1, "more thing") + " below." : "") + '</div></div>';
}
function head(title, lede){ return '<div class="tabhead" data-tour="page"><h1>' + E(title) + '</h1><p>' + E(lede) + '</p></div>'; }

/* ---------- shell ---------- */
/* Two rows. The top row is the sections of the business (Overview, Office,
   Field, Assistants, and inside the app, Shop and settings). The row under it
   holds the pages of whichever section is open. */
const SECTIONS = [
  { key:"",           label:"Overview" },
  { key:"Office",     label:"Office" },
  { key:"Field",      label:"Field" },
  { key:"Assistants", label:"Assistants" },
  { key:"Admin",      label:"Admin" }
];
const secOf = t => (TABS[t] && TABS[t].group) || "";
function badgeFor(list){
  let stops = 0, cautions = 0;
  list.forEach(t => { if(t === "overview") return; alertsFor(t).forEach(a => { if(a.lvl === "stop") stops++; else if(a.lvl === "caution") cautions++; }); });
  return stops ? '<span class="badge stop">' + stops + '</span>' : (cautions ? '<span class="badge caution">' + cautions + '</span>' : '');
}
function drawTabs(){
  const here = secOf(current);
  let secs = "";
  SECTIONS.forEach(sec => {
    const pages = CFG.tabs.filter(t => secOf(t) === sec.key);
    if(!pages.length) return;
    secs += '<button class="sec" data-sec="' + E(sec.key || "overview") + '" aria-current="' + (sec.key === here) + '">' + ico(SEC_ICO[sec.key]) + E(sec.label) + badgeFor(pages) + '</button>';
  });
  $("secs").innerHTML = secs;
  const pages = here ? CFG.tabs.filter(t => secOf(t) === here) : [];
  let html = "";
  pages.forEach(t => {
    html += '<button class="tab" role="tab" data-tab="' + t + '" aria-selected="' + (t === current) + '">' + ico(t) + E(TABS[t].label) + badgeFor([t]) + '</button>';
  });
  /* The shop is part of Field. Its screens (stock out and back, transfers,
     shelf, orders, filter certificates) are the inventory side of this same
     app, so the Shop page opens them. */
  if(PLATFORM === "app" && here === "Field") html += '<a class="tab" href="/shop.html#/" data-tour="shop">Shop</a>';
  $("tabs").innerHTML = html;
  $("tabs").hidden = !pages.length;
}
function goSection(key){
  if(key === "overview") return go("overview");
  const pages = CFG.tabs.filter(t => secOf(t) === key);
  const last = store("sec." + ROLE + "." + key);
  go(pages.includes(last) ? last : pages[0]);
}
function render(){
  drawTabs(); tblN = 0;
  const v = VIEWS[current];
  /* Somebody is typing in a form on this page. Leave it alone; the numbers catch up next time. */
  if(v && v.hold && v.hold()) return;
  let html;
  try{ html = v ? v.render() : '<div class="state">Nothing here.</div>'; }
  catch(e){ html = '<div class="state err">This tab hit a fault while drawing: ' + E(e && e.message) + '. Press Refresh. If it keeps happening, tell Bruce.</div>'; }
  $("main").innerHTML = html + footer();
  try{ afterRender(); }catch(e){}
  const n = S.jobs ? S.jobs.length : 0;
  $("connlabel").textContent = S.jobs && S.jobsMore ? ("Reading jobs · " + n + " of " + (S.jobTotal || "?")) : S.jobs ? ("Live · " + n + " jobs" + (S.stamp ? " · " + new Date(S.stamp).toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"}) : "")) : (S.jobsErr ? (S.jobsErr.code === "not_connected" ? "JobTread not connected" : "JobTread not answering") : "Reading");
  /* When JobTread is down or not connected, the label says why and, for an admin, opens Connections. */
  const cl = $("connlabel"); cl.title = S.jobsErr ? errCopy(S.jobsErr) : "";
  cl.style.cursor = S.jobsErr && ME.admin ? "pointer" : ""; cl.style.textDecoration = S.jobsErr && ME.admin ? "underline" : "";
  cl.onclick = S.jobsErr && ME.admin ? () => go("connections") : null;
  $("conndot").className = "dot " + (S.jobsErr ? "bad" : (S.jobs ? (S.jobsShort ? "warn" : "ok") : ""));
  if(drawerState && drawerState.kind === "list") openList(drawerState.key, true);
}
function footer(){
  return '<div class="note"><b>Where these numbers come from.</b> Read live from ' +
    (CFG.qb ? "JobTread and QuickBooks" : "JobTread") + (PLATFORM === "app" ? ", plus the shop's own stock records," : "") + (CFG.gmail ? ", plus your Gmail drafts," : "") +
    (PLATFORM === "app" ? ' through the A&amp;M app, every few minutes or when you press Refresh.' : ' using your own sign in, every time the page opens or you press Refresh.') + (PLATFORM === "app" ? ' Nothing is copied into a second list. QuickBooks is only read, apart from the payroll journal entry posted on the Payroll page. The only things saved back to JobTread are job details someone changes and finished post-mortem notes, each under that person\'s name. ' : ' Nothing is copied or stored here and nothing here changes either system. ') +
    'To change a job, open it and press <b>Open in JobTread</b>. Site photos live in Encircle and safety records live in SiteDocs, so neither is shown here. All money is Canadian dollars.</div>' +
    '<div class="foot"><span>A&amp;M Abatement Services Ltd</span><span>' + E(CFG.title) + '</span><span class="sp"></span><span>' + (PLATFORM === "app" ? 'Reads live; changes only what a person saves' : 'Reads live, stores nothing, changes nothing') + '</span></div>';
}
function go(tab){
  if(!CFG.tabs.includes(tab)) tab = "overview";
  current = tab; store("tab." + ROLE, tab);
  if(secOf(tab)) store("sec." + ROLE + "." + secOf(tab), tab);
  try{ history.replaceState(null, "", "#" + tab); }catch(e){}
  if(window.UX) UX.enterNext = true;
  render(); window.scrollTo(0, 0);
}

/* ---------- drawer: one job, or a list of jobs ---------- */
let drawerState = null, lastFocus = null;
function openDrawer(title, html){
  lastFocus = document.activeElement;
  $("dtitle").innerHTML = title; $("dbody").innerHTML = html;
  $("scrim").hidden = false; $("drawer").hidden = false; $("dclose").focus();
}
function closeDrawer(){

  const g = [], s = st(j), stage = stageOf(s);

  if(["won","sched","site","close"].includes(stage) && !pm(j)) g.push("Project Manager");
  if(["sched","site"].includes(stage) && !startOf(j)) g.push("Expected Date of Project Start");
  if(["sched","site"].includes(stage) && crew(j) === null) g.push("Number of Guys Required");
  if(["sched","site"].includes(stage) && dur(j) === null) g.push("Estimated Days of Work");

/* ---------- QuickBooks readers ----------
   The receivables aging report lists each customer, then that customer's jobs underneath,
   then a "Total for" row. Adding every row counts a customer two or three times, which is how
   the report's own summary said 2.7 million on 6 October when the balance sheet said 2.0 million.
   Only the customer rows themselves are added here: no dot in the row id, and not a total row.
   The result is then checked against the balance sheet, and any gap is said out loud. */
const BK = ["Current","1-30","31-60","61-90","91+"];
const BKLAB = { "Current":"Not due yet", "1-30":"1 to 30 days late", "31-60":"31 to 60 days late", "61-90":"61 to 90 days late", "91+":"Over 90 days late" };
function agingOf(p){
  const rows = (p && p.reportData && p.reportData.rows) || [];
  const out = { list:[], tot:{ Current:0, "1-30":0, "31-60":0, "61-90":0, "91+":0, Total:0 } };
  rows.forEach(r => {
    const m = r.metadata || {}, id = String(m.id || ""), ty = m.type || [];
    if(id.indexOf(".") > -1 || ty.indexOf("TOTAL") > -1) return;
    const c = {}; let name = "";
    (r.cells || []).forEach((x, i) => { const k = String(x.name || "").replace(/\s+/g, ""); if(i === 0) name = x.value; c[k] = Number(x.value) || 0; });
    if(/^Total\b/i.test(String(name))) return;
    const row = { name:String(name || ""), b:{}, total:c.Total || 0 };
    BK.forEach(k => { row.b[k] = c[k] || 0; out.tot[k] += row.b[k]; });
    row.late = BK.slice(1).reduce((s, k) => s + row.b[k], 0);
    row.old = row.b["61-90"] + row.b["91+"];
    out.tot.Total += row.total;
    out.list.push(row);
  });
  out.tot.Late = BK.slice(1).reduce((s, k) => s + out.tot[k], 0);
  return out;
}
/* Everything below the readers works from one plain shape, S.M, whichever way the
   numbers arrived: through Claude's QuickBooks connector, or from the A&M app's
   own server. bs, ar, ap and pl are each null until they arrive. */
function bsValRaw(p, nameRe){
  const rows = (p && p.reportData && p.reportData.rows) || [];
  for(const r of rows){
    let name = "", tot = null;
    (r.cells || []).forEach(x => { if(x.name === "ACCOUNT_NAME") name = x.value; if(x.name === "DETAIL_NATURAL_HOME_AMOUNT__TOTAL") tot = Number(x.value); });
    if(nameRe.test(String(name))) return tot;
  }
  return null;
}
function normBS(p){
  if(!p || !p.summary) return null;
  const s = p.summary;
  return {
    cash: s.assetBreakdown ? s.assetBreakdown.cash : null,
    arBS: s.assetBreakdown ? s.assetBreakdown.accountsReceivable : null,
    apBS: s.liabilityBreakdown ? s.liabilityBreakdown.accountsPayable : null,
    ratio: s.ratios ? s.ratios.currentRatio : null,
    wc: s.ratios ? s.ratios.workingCapital : null,
    holdbacks: bsValRaw(p, /^Holdbacks Receivable/i),
    inventory: bsValRaw(p, /^Inventory Asset$/i),
    tools: bsValRaw(p, /^Tools and Equipment$/i),
    vehicles: bsValRaw(p, /^Vehicles$/i)
  };
}
function normPL(p){
  if(!p) return null;
  const rows = (p.reportData && ((p.reportData.data && p.reportData.data.rows) || p.reportData.rows)) || [];
  const cells = r => { const o = {}; (r.cells || []).forEach(x => { o[x.name] = x.value; }); return o; };
  let payroll = null, consulting = null, labour = 0, labourSeen = false, expenses = null;
  rows.forEach(r => {
    const c = cells(r), a = String(c.ACCOUNT_NAME || ""), v = Number(c.DETAIL_NATURAL_HOME_AMOUNT__TOTAL) || 0;
    const top = String((r.metadata || {}).id || "").indexOf(".") === -1;
    if(/^Total for .*Payroll Expenses/i.test(a)) payroll = v;
    if(/Consulting Fees/i.test(a) && !/^Total for/i.test(a)) consulting = v;
    if(/labou?r\s+cos/i.test(a) && !/^Total for/i.test(a)){ labour += v; labourSeen = true; }
    if(top && a === "Expenses") expenses = v;
  });
  const income = Number(p.totalIncome) || 0, gp = Number(p.grossProfit) || 0;
  return { income, gp, cogs: income - gp, expenses, payroll, labour: labourSeen ? labour : null, consulting };
}

/* A rough 13-week view of the bank balance. QuickBooks' detail reports come through
   the connector cut off at 50 lines, so due dates cannot be read invoice by invoice.
   This works from the aging totals and this year's pace instead, and shows every
   assumption so anybody can change them. */
function runway(){
  const n = moneyNums(), b = booksCheck();
  if(!S.M.bs || !n.ar || !n.ap || !b) return null;
  const days = plDays();
  const weeklySales = b.income / days * 7 * 1.05;            /* with 5% GST, as invoiced */
  const wagesYTD = (b.payroll || 0) + (b.labour || 0);
  const weeklyWages = wagesYTD / days * 7;
  const cogs = b.income - b.gp, exp = b.expenses || 0;
  const weeklyOther = Math.max(0, (cogs + exp - wagesYTD) / days * 7 * 1.05);
  const W = 13, rows = [];
  let bal = n.cash || 0, low = { bal, wk:0 };
  for(let w = 1; w <= W; w++){
    let inn = 0, out = 0;
    if(w <= 4) inn += n.ar.tot.Current / 4;
    if(w <= 8) inn += n.ar.tot.Late * FIN.lateIn / 100 / 8;
    if(w > FIN.collectWeeks) inn += weeklySales;
    if(w <= 4) out += n.ap.tot.Current / 4 + n.ap.tot.Late * FIN.lateOut / 100 / 4;
    out += weeklyWages;
    if(w > 4) out += weeklyOther;
    bal += inn - out;
    if(bal < low.bal) low = { bal, wk:w };
    const ws = new Date(today()); ws.setDate(ws.getDate() + (w - 1) * 7 - ((ws.getDay() + 6) % 7));
    rows.push({ w, ws, inn, out, bal });
  }
  return { rows, low, weeklySales, weeklyWages, weeklyOther, start:n.cash || 0 };
}
function runwayChart(r){
  const W = 640, H = 170, pl = 64, pr = 12, pt = 12, pb = 26;

  const x = i => pl + i * (W - pl - pr) / (vals.length - 1), y = v => pt + (hi - v) / span * (H - pt - pb);
  const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const ticks = [hi, (hi + lo) / 2, lo];
  return '<div class="scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="min-width:420px;max-width:720px;display:block" role="img" aria-label="Bank balance over 13 weeks">' +
    ticks.map(t => '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--rule-soft)"/>' +
      '<text x="' + (pl - 6) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="Arial,Helvetica,sans-serif">' + E(MK(t)) + '</text>').join("") +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="var(--ink-3)" stroke-dasharray="3 3"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="var(--cyan)" stroke-width="2.5"/>' +
    vals.map((v, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3" fill="' + (v < 0 ? "var(--stop)" : "var(--cyan)") + '"/>').join("") +
    [0, 4, 8, 13].map(i => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? "start" : i === 13 ? "end" : "middle") + '" font-size="11" fill="var(--ink-3)">' + (i === 0 ? "Today" : "Week " + i) + '</text>').join("") +
    '</svg></div>';
}

/* Labour cost ladder: what an hour of a person really costs once the employer's share is added. */
function ladderRow(wage){
  const pay = wage * FIN.hrs;
  const cpp = Math.max(0, FIN.cpp / 100 * pay - FIN.cppCredit), ei = FIN.ei / 100 * pay, hol = FIN.hol / 100 * pay, wcb = FIN.wcb / 100 * pay;
  const total = pay + cpp + ei + hol + wcb + FIN.ben;
  return { wage, reg: total / FIN.hrs, ot: total / FIN.hrs * 1.5, load: total / pay - 1 };
}
function ladderOut(){
  const me = ladderRow(Number(FIN.wage) || 0);
  const steps = []; for(let w = 20; w <= 40; w += 2) steps.push(ladderRow(w));
  return '<div class="big num">$' + me.reg.toFixed(2) + '<span style="font-size:15px;color:var(--ink-3)"> an hour</span></div>' +

/* ---------- inside the A&M app: data comes from the app's own server ----------
   The command centre is signed in to at the app's front door (/) with a work
   email and password. The account's key and session are read from this
   device's storage (acctToken, acctSession). What each person sees and can do
   is set by an admin on Admin, People and access, and checked on the server on
   every request; this page only draws it. After the hours without use an admin
   chose (8 by default), it sends people back to the front door to sign in again.
   The shop keeps its own PIN sign-in; its keys on this device are not touched. */
let TOKEN = "";
function idbToken(){ return idbGet("acctToken").then(v => v || ""); }
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open("am-inventory", 1);
    rq.onupgradeneeded = () => {
      /* Same shape the app makes, so opening here first never breaks it. */
      const d = rq.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("events")) d.createObjectStore("events", { keyPath:"id" });
      if(!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath:"id" });
    };
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
function idbGet(k){
  return idbOpen().then(d => new Promise(res => {
    try{ const g = d.transaction("kv", "readonly").objectStore("kv").get(k); g.onsuccess = () => res(g.result); g.onerror = () => res(undefined); }catch(e){ res(undefined); }
  })).catch(() => undefined);
}
function idbSet(k, v){
  return idbOpen().then(d => new Promise(res => {
    try{ const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }catch(e){ res(); }
  })).catch(() => {});
}
/* Back to the front door: signing in again, or signing out. */
async function toDoor(out){
  if(out){ await idbSet("acctToken", null); await idbSet("acctSession", null); return location.replace("/?out=1"); }
  const sec = current || (location.hash || "").replace("#", "");
  const h = sec && sec !== "overview" && /^[a-z]+$/.test(sec) ? "&h=" + encodeURIComponent("#" + sec) : "";
  location.replace("/?next=command" + h);
}
let LOCK_MIN = 480, touchedAt = 0;
const idleMinutes = s => s ? (Date.now() - new Date(s.lastSeen || s.at).getTime()) / 60000 : Infinity;
/* Using the page keeps the session awake, exactly as using the shop screens does. */
function touch(){
  const now = Date.now(); if(now - touchedAt < 20000) return; touchedAt = now;
  idbGet("acctSession").then(s => { if(s){ s.lastSeen = new Date().toISOString(); return idbSet("acctSession", s); } });
}
/* A token the office has switched off or that has run out sends people to sign in again, from any screen. */
const _cfetch = window.fetch.bind(window);
window.fetch = function(input, init){
  return _cfetch(input, init).then(r => {
    const u = typeof input === "string" ? input : (input && input.url) || "";
    if(r.status === 401 && /\/api\//.test(u) && TOKEN) { TOKEN = ""; idbSet("acctToken", null).then(() => toDoor()); }
    return r;
  });
};
function api(part, fresh){
  return fetch("/api/command?part=" + part + (fresh ? "&fresh=1" : ""), { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" })
    .then(async r => {
      const b = await r.json().catch(() => ({}));
      if(!r.ok) throw { code: b.error || ("http_" + r.status), message: b.message || ("The app answered " + r.status + "."), status: r.status };
      return b;
    });
}
function appLoad(fresh){
  const waits = [];
  /* The first answer carries up to about seven seconds' worth of jobs. If
     there are more, keep asking with the nextPage it hands back, and show the
     list growing as it comes. */
  waits.push(api("jobs", fresh).then(async d => {
    let rows = d.nodes || [], next = d.nextPage, guard = 0;
    const show = () => {
      S.jobs = rows.map(flat); S.jobTotal = d.total; S.stamp = d.storedAt;
      S.jobsShort = d.total != null && rows.length < d.total; S.jobsMore = !!next;
      S.orders = d.orders || []; S.jobsErr = S.ordersErr = null; render();
    };
    show();
    while(next && guard++ < 30){
      const r = await fetch("/api/command?part=jobs&page=" + encodeURIComponent(next), { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" });
      const b = await r.json().catch(() => ({}));
      if(!r.ok) throw { code: b.error || ("http_" + r.status), message: b.message || ("The app answered " + r.status + "."), status: r.status };
      rows = rows.concat(b.nodes || []); next = b.nextPage || null; show();
    }
  }).catch(e => { S.jobsErr = S.ordersErr = e; render(); }));
  if(CFG.qb) waits.push(api("money", fresh).then(d => {
    S.M.bs = d.bs; S.M.ar = d.ar; S.M.ap = d.ap; S.M.pl = d.pl;
    S.bsErr = S.arErr = S.apErr = S.plErr = null; render();
  }).catch(e => { S.bsErr = S.arErr = S.apErr = S.plErr = e; render(); }));
  if(ME.areas.some(a => ["office","field","money"].includes(a))) waits.push(api("inventory", fresh).then(d => { S.inv = d; S.invErr = null; render(); })
    .catch(e => { S.invErr = e; render(); }));
  if(CFG.tabs.includes("drafts")) waits.push(loadMail());
  if(CFG.tabs.includes("postmortem")) waits.push(loadPM());
  if(CFG.tabs.includes("people")) waits.push(loadAccounts());
  if(CFG.tabs.includes("buying")) waits.push(api("buying", fresh).then(d => { S.buy = d; render(); })
    .catch(e => { S.buy = { errors:{ jobtread: errCopy(e), quickbooks: errCopy(e) } }; render(); }));
  return Promise.all(waits);
}

function addWorkDays(d, n){ const x = new Date(d); let left = Math.max(1, Math.ceil(n)); while(true){ const w = x.getDay(); if(w !== 0 && w !== 6){ left--; if(left === 0) return x; } x.setDate(x.getDate() + 1); } }
function crewLoad(){
  const J = live().filter(j => ["won","sched","site"].includes(stageOf(st(j))) && startOf(j));
  const t = today(), mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const weeks = [];
  for(let w = 0; w < 4; w++){
    const ws = new Date(mon); ws.setDate(mon.getDate() + w * 7);
    let peak = 0; const jobs = new Set(), unknown = new Set();
    for(let d = 0; d < 5; d++){
      const day = new Date(ws); day.setDate(ws.getDate() + d);
      if(day < t) continue;
      let sum = 0;
      J.forEach(j => {
        const s = dOnly(startOf(j)); if(!s || s > day) return;
        let end = addWorkDays(s, dur(j) || 1);
        if(stageOf(st(j)) === "site" && end < t) end = t; /* still on site past plan: assume today at least */
        if(day > end) return;
        jobs.add(j._id); if(crew(j) === null) unknown.add(j._id); else sum += crew(j);
      });
      peak = Math.max(peak, sum);
    }
    weeks.push({ ws, peak, jobs:[...jobs], unknown:[...unknown] });
  }
  return weeks;
}

/* ================= BUYING ================= */
/* What to order, what is on order, what has to be paid, who it is spent with,
   and whether the subtrades on site have their paperwork. JobTread owns
   purchase orders and the supplier records; QuickBooks owns bills and spend;
   the shop screens own what is on the shelf. Nothing here changes any of them. */
const normName = s => String(s || "").toLowerCase().replace(/&/g, "and").replace(/\b(ltd|inc|corp|co|limited|the)\b\.?/g, "").replace(/[^a-z0-9]+/g, " ").trim();

/* Inside Claude the two JobTread lists are read through the connector. */
function loadBuyingClaude(){
  S.buy = S.buy || { pos:null, vendors:null, bills:null, spend:null, errors:{} };
  const page = (alias, args, nodes, token, acc) => S.mcp.callTool(JT, "query", { query:{ organization:{ "$":{ id:ORG },
      [alias]:{ "_": alias === "v" ? "accounts" : "documents", "$": Object.assign({}, args, token ? { page:token } : {}), nextPage:{}, nodes } } } }, { cache:{ staleTime:300000 } })
    .then(res => {
      const d = res && res.payload && res.payload.organization && res.payload.organization[alias];
      if(!d) throw { code:"tool_error", message:"JobTread did not answer." };
      acc = acc.concat(d.nodes || []);
      return d.nextPage && acc.length < 5000 ? page(alias, args, nodes, d.nextPage, acc) : acc;
    });
  page("d", { size:100, where:["type","vendorOrder"] }, { id:{}, name:{}, status:{}, cost:{}, issueDate:{}, dueDate:{}, account:{ name:{} }, job:{ id:{}, number:{}, name:{} } }, null, [])
    .then(p => { S.buy.pos = p; render(); }).catch(e => { S.buy.errors.jobtread = errCopy(e); render(); });
  page("v", { size:50, where:["type","vendor"] }, { id:{}, name:{}, customFieldValues:{ nodes:{ value:{}, customField:{ name:{} } } } }, null, [])
    .then(v => {
      S.buy.vendors = v.map(n => { const f = {}; ((n.customFieldValues && n.customFieldValues.nodes) || []).forEach(x => { if(x.customField) f[x.customField.name] = x.value; });
        return { id:n.id, name:n.name, wcb: f["WCB"] === true, coiExpires: f["COI Expires"] || "" }; });
      render();
    }).catch(e => { S.buy.errors.jobtread = errCopy(e); render(); });
}

function openPOs(){
  const B = S.buy; if(!B || !B.pos) return null;
  return B.pos.filter(p => !["denied","closed","void"].includes(String(p.status || "").toLowerCase()))
    .map(p => ({ p, d: p.dueDate ? daysTo(p.dueDate) : null })).sort((a, b) => (a.d ?? 999) - (b.d ?? 999));
}
function billsDue(){
  const B = S.buy; if(!B || !B.bills) return null;
  const list = B.bills.filter(b => b.open > 0.005).map(b => ({ b, d: daysTo(b.due) }));
  return { late: list.filter(x => x.d !== null && x.d < 0), week: list.filter(x => x.d !== null && x.d >= 0 && x.d <= 7), all:list };
}
function activeSuppliers(){
  const names = new Map();
  const add = (n, why) => { const k = normName(n); if(!k) return; if(!names.has(k)) names.set(k, { name:n, why:new Set() }); names.get(k).why.add(why); };
  if(S.M.ap) S.M.ap.list.forEach(r => { if(r.total > 0.5) add(r.name, "owed money"); });
  const po = openPOs(); if(po) po.forEach(x => add(x.p.account && x.p.account.name, "open PO"));
  return names;
}
function paperwork(){
  const B = S.buy; if(!B || !B.vendors) return null;
  const byName = new Map(B.vendors.map(v => [normName(v.name), v]));
  const rows = [];
  for(const [k, a] of activeSuppliers()){
    const v = byName.get(k);
    const coiD = v && v.coiExpires ? daysTo(v.coiExpires) : null;
    const gaps = [];
    if(!v) gaps.push("not in JobTread");

const PMLINES = {

  cli: { label:"Client", lines:[

    "Close-out package complete: clearance, waste manifests, photos, short deficiency list",

const N1 = v => (v === null || v === undefined || isNaN(v)) ? "" : (Math.round(v * 10) / 10).toLocaleString("en-CA");

/* ---------- opening, editing, saving ---------- */
function pmOpen(jobId){
  PM.open = jobId; PM.rec = null; PM.facts = null; PM.factsErr = null; PM.msg = ""; PM.savedAt = null;
  if(current !== "postmortem") go("postmortem"); else render();
  window.scrollTo(0, 0);
  const j = (S.jobs || []).find(x => x._id === jobId) || {};
  Promise.all([pmCall("action=get&jobId=" + encodeURIComponent(jobId)), pmCall("action=facts&jobId=" + encodeURIComponent(jobId)).catch(e => ({ _err: e }))]).then(([g, f]) => {
    if(PM.open !== jobId) return;
    if(f && f._err){ PM.factsErr = f._err; f = {}; }
    PM.facts = f;
    const fj = f.job || {};
    PM.rec = g.record || { jobId, number: fj.number || j._number || "", name: fj.name || j._name || "", client: fj.client || j._cust || "", pm: fj.pm || pm(j) || "", jobType: fj.jobType || F(j["Job Type"]) || "",
      status: "draft", facilitator: ["Craig","Jen","Amir"].includes(S.meName) ? S.meName : "Craig", date: iso(new Date()), attendees: [], standout: "",
      scores: { fin:[null,null,null,null], ops:[null,null,null,null], cli:[null,null,null,null], emp:[null,null,null,null] }, learned: { fin:"", ops:"", cli:"", emp:"" },
      figures: {}, keep: [], commitments: [] };
    render();
  }).catch(e => { PM.rec = null; PM.open = null; PM.pageErr = e; render(); });
}
function pmSnapshot(){
  const n = pmNumbers();
  return { price: n.price.v, cost: n.cost, margin: n.actMargin, planPrice: n.p.price || null, planCost: n.planCost, planMargin: n.planMargin,
    labourHours: n.hrs.v, planHours: n.p.labourHours || null, days: n.days.v, planDays: n.p.days || null };
}
function pmSave(finish){
  if(!PM.rec || !CAN_EDIT) return Promise.resolve();
  clearTimeout(PM.timer); PM.timer = null;

  if(finish) rec.status = "finished";

    const m = $("pmMsg"); if(m) m.textContent = "Saved " + new Date().toLocaleTimeString("en-CA", { hour:"numeric", minute:"2-digit" });

function acctCall(params, body){
  const opts = body ? { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" }, body: JSON.stringify(body) }
                    : { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" };
  return fetch("/api/account" + (params ? "?" + params : ""), opts).then(async r => {
    const b = await r.json().catch(() => ({}));
    if(!r.ok) throw { code: b.error || ("http_" + r.status), message: b.message || ("The app answered " + r.status + "."), status: r.status };

}

function logWords(l){
  const who = l.who ? l.who + ": " : "";

function acMsg(t){ const m = $("acMsg"); if(m) m.textContent = t; }

document.addEventListener("click", ev => {
  const t = ev.target.closest && ev.target.closest("[data-ac-new],[data-ac-edit],[data-ac-save],[data-ac-reset],[data-ac-active],[data-ac-remove],[data-ac-copy],[data-ac-done],[data-ac-idle],[data-ac-yes],[data-me-open],[data-me-save]");
  if(!t) return;
  if(t.dataset.acNew !== undefined) return acOpen("");
  if(t.dataset.acEdit) return acOpen(t.dataset.acEdit);

  if(t.dataset.meSave !== undefined) return meSave(t);
  if(t.dataset.acDone !== undefined){ closeDrawer(); return; }
  if(t.dataset.acCopy !== undefined){
    const txt = ($("acTempPw") || {}).textContent || "";
    const done = () => { t.textContent = "Copied"; setTimeout(() => { t.textContent = "Copy"; }, 2000); };
    try{ navigator.clipboard.writeText(txt).then(done, () => { selectText($("acTempPw")); }); }catch(e){ selectText($("acTempPw")); }
    return;
  }
  if(t.dataset.acIdle !== undefined){
    const n = Number($("acIdle").value), m = $("acIdleMsg");
    t.disabled = true; m.textContent = "Saving…";
    acctCall("", { action:"settings", idleHours:n }).then(r => { ADM.settings = r.settings; m.textContent = "Saved. Everybody is asked again after " + plural(n, "hour") + " without use."; t.disabled = false; loadAccounts(); })
      .catch(e => { m.textContent = errCopy(e); t.disabled = false; });
    return;
  }
  const id = drawerState && drawerState.kind === "account" ? drawerState.id : "";
  const a = id ? (ADM.list || []).find(x => x.id === id) : null;

    if(!body.areas.some(x => ["office","money","field"].includes(x))) return acMsg("Tick at least one of Office, Money or Field.");

      loadAccounts();

    t.outerHTML = '<button type="button" class="btn" data-ac-yes="reset">Yes, sign ' + E(a.name.split(" ")[0]) + ' out and make a new one</button>'; return;

    acctCall("", { action:"update", id, active: on }).then(r => {
      ADM.list = ADM.list.map(x => x.id === id ? r.account : x); acOpen(id); acMsg(on ? r.account.name + " can sign in again." : r.account.name + " is switched off and signed out.");

  }
});

function meSave(btn){
  const f = $("meForm"), v = n => f.querySelector('[name="' + n + '"]').value, m = $("meMsg");
  if(v("n1").length < 10) return m.textContent = "Use at least 10 characters.";
  if(v("n1") !== v("n2")) return m.textContent = "The two new ones do not match.";
  btn.disabled = true; m.textContent = "Saving…";
  acctCall("", { action:"password", current: v("cur"), next: v("n1") }).then(async r => {

   Danielle's report: each employee's hours split into the cost of sales
   buckets (service line, Edmonton or Calgary), with shop and office time kept
   in general payroll. Worked out on the server from JobTread timesheets
   (netlify/functions/payroll.mjs). She types each person's payroll cost and the
   page builds the journal entry; pressing Post sends it to QuickBooks once per
   pay period. Costs typed here are not saved anywhere. */
const PY = { start:null, data:null, err:null, loading:false, costs:{}, journal:null, jErr:null, busy:false, msg:"", lists:null, listsErr:null, edit:null };

function pyCall(params, body){
  const opts = body ? { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" }, body: JSON.stringify(body) }
                    : { headers:{ authorization:"Bearer " + TOKEN }, cache:"no-store" };
  return fetch("/api/payroll" + (params ? "?" + params : ""), opts).then(async r => {
    const b = await r.json().catch(() => ({}));
    if(!r.ok) throw Object.assign({ code: b.error || ("http_" + r.status), message: b.message || ("The app answered " + r.status + "."), status: r.status }, b);

function loadPY(start){

    if(PY.data && PY.data.report.period.start !== d.report.period.start){ PY.costs = {}; PY.journal = null; PY.jErr = null; PY.msg = ""; }
    PY.data = d; PY.start = d.report.period.start; PY.err = null; PY.loading = false; render();
  }).catch(e => { PY.err = e; PY.loading = false; render(); });

function pyBuckets(rep){

function pyCsv(rows){ return rows.map(r => r.map(v => { const s = String(v === null || v === undefined ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); }
function pyDownload(kind){
  const rep = PY.data && PY.data.report; if(!rep) return;
  const p = rep.period; let rows, name;
  if(kind === "summary"){
    rows = [["Employee","Total hours","Regular","Overtime","Not yet approved"].concat(rep.buckets).concat(rep.buckets.map(b => b + " share of pay"))];
    rep.employees.forEach(e => rows.push([e.name, e.total, e.regular, e.overtime, e.unapproved].concat(rep.buckets.map(b => e.byBucket[b] ? e.byBucket[b].total : 0)).concat(rep.buckets.map(b => e.share[b] ? (e.share[b] * 100).toFixed(2) + "%" : "0%"))));
    rows.push(["Total", rep.totals.hours, "", "", rep.totals.unapproved].concat(rep.buckets.map(b => rep.totals.byBucket[b] || 0)));
    name = "Payroll Split - " + p.start + ".csv";
  } else {
    rows = [["Employee","Job","Job name","Cost code","Bucket","City from address","Regular hours","Overtime hours","Total hours","Not yet approved"]];
    rep.detail.forEach(d => rows.push([d.person, d.job, d.jobName, d.costCode, d.bucket, d.assumed ? "Yes" : "", d.reg, d.ot, d.total, d.unapproved]));

document.addEventListener("click", ev => {
  const t = ev.target.closest && ev.target.closest("[data-py-go],[data-py-csv],[data-py-preview],[data-py-post],[data-py-forget],[data-py-lists],[data-py-save]");
  if(!t) return;
  if(t.dataset.pyGo){ PY.data = PY.data && PY.data.report.period.start === t.dataset.pyGo ? PY.data : null; loadPY(t.dataset.pyGo); render(); return; }
  if(t.dataset.pyCsv){ pyDownload(t.dataset.pyCsv); return; }
  const start = PY.data && PY.data.report.period.start;
  if(t.dataset.pyPreview !== undefined || t.dataset.pyPost !== undefined){
    const post = t.dataset.pyPost !== undefined;
    if(post && !confirm("Post this journal entry to QuickBooks? It moves " + D2(PY.journal && PY.journal.moved) + " from payroll expense into cost of sales for " + start + " to " + PY.data.report.period.end + ". It can only be posted once per pay period.")) return;

    pyCall("", { action:"journal", start, costs: PY.costs, post }).then(res => {

    return;
  }
  if(t.dataset.pyForget !== undefined){
    if(!confirm("Only do this after deleting the journal entry in QuickBooks. Clear the posted record for this period?")) return;
    pyCall("", { action:"forget", start }).then(() => { PY.data.posted = null; PY.journal = null; render(); }).catch(e => { PY.jErr = e; render(); });

    pyCall("action=lists").then(l => { PY.lists = l; PY.listsErr = null; render(); }).catch(e => { PY.listsErr = e; render(); });

    document.addEventListener("keydown", ev => { if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "j"){ ev.preventDefault(); toggle(); } if(ev.key === "Escape" && panel && !panel.hidden) close(); });
  }
  function clampBub(){ const r = bub.getBoundingClientRect(), x = Math.min(Math.max(8, r.left), innerWidth - r.width - 8), y = Math.min(Math.max(70, r.top), innerHeight - r.height - 8); bub.style.left = x + "px"; bub.style.top = y + "px"; }
  function dragBubble(){
    let s = null;
    bub.addEventListener("pointerdown", ev => { const r = bub.getBoundingClientRect(); s = { x: ev.clientX, y: ev.clientY, ox: ev.clientX - r.left, oy: ev.clientY - r.top, moved:false }; bub.setPointerCapture(ev.pointerId); });
    bub.addEventListener("pointermove", ev => {
      if(!s) return;
      if(!s.moved && Math.hypot(ev.clientX - s.x, ev.clientY - s.y) < 6) return;
      s.moved = true; bub.classList.add("dragging"); bub.style.right = "auto"; bub.style.bottom = "auto";
      bub.style.left = (ev.clientX - s.ox) + "px"; bub.style.top = (ev.clientY - s.oy) + "px";
    });
    bub.addEventListener("pointerup", () => {
      if(!s) return; const moved = s.moved; s = null; bub.classList.remove("dragging");
      if(!moved) return toggle();
      /* Snap to the nearest side, the way a phone's floating buttons do. */
      const r = bub.getBoundingClientRect(), left = r.left + r.width / 2 < innerWidth / 2;
      const y = Math.min(Math.max(70, r.top), innerHeight - r.height - 8);
      bub.style.transition = "left .3s cubic-bezier(.2,.9,.3,1.2), top .3s"; bub.style.left = (left ? 14 : innerWidth - r.width - 14) + "px"; bub.style.top = y + "px";
      setTimeout(() => { bub.style.transition = ""; }, 320);
      store(POS, JSON.stringify({ x: parseFloat(bub.style.left), y: parseFloat(bub.style.top) }));
    });
    addEventListener("resize", () => { if(bub.style.left) clampBub(); });
  }
  function build(){
    panel = document.createElement("section"); panel.id = "cPanel"; panel.hidden = true; panel.setAttribute("aria-label", "Ask Claude");
    panel.innerHTML = '<div class="ch" id="cHead"><span class="grip"></span><div><b>Ask Claude</b><div class="sm" id="cSub">Reads this page with you</div></div><button class="cx" type="button" aria-label="Close" id="cClose">&times;</button></div>' +
      '<div id="cMsgs" aria-live="polite"></div><div id="cChips"></div>' +
      '<form id="cForm" onsubmit="return false"><textarea id="cIn" rows="1" placeholder="Ask about this page…"></textarea><button type="submit" id="cSend">Ask</button></form>' +
      '<a id="cHand" href="#" target="_blank" rel="noopener">Continue in my own Claude</a>';
    document.body.appendChild(panel);
    panel.querySelector("#cClose").onclick = close;
    panel.querySelector("#cForm").onsubmit = () => { const t = panel.querySelector("#cIn"); ask(t.value); t.value = ""; grow(); return false; };
    const ta = panel.querySelector("#cIn");
    ta.addEventListener("keydown", ev => { if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); panel.querySelector("#cForm").onsubmit(); } });
    ta.addEventListener("input", () => { grow(); panel.querySelector("#cHand").href = handOver(ta.value); });
    panel.querySelector("#cHand").addEventListener("click", ev => { ev.currentTarget.href = handOver(ta.value || lastQ()); });
    panel.addEventListener("click", ev => { const c = ev.target.closest(".chip"); if(c) ask(c.textContent); });
    dragPanel();
  }
  const lastQ = () => { for(let i = msgs.length - 1; i >= 0; i--) if(msgs[i].role === "user") return msgs[i].content; return ""; };
  function grow(){ const t = panel.querySelector("#cIn"); t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
  function dragPanel(){
    const head = panel.querySelector("#cHead"); let s = null;
    head.addEventListener("pointerdown", ev => { if(ev.target.closest("button")) return; const r = panel.getBoundingClientRect(); s = { x: ev.clientX, y: ev.clientY, r, phone: innerWidth <= 640 }; head.setPointerCapture(ev.pointerId); panel.style.transition = "none"; });
    head.addEventListener("pointermove", ev => {
      if(!s) return;
      if(s.phone){ const dy = Math.max(0, ev.clientY - s.y); panel.style.transform = "translateY(" + dy + "px)"; s.dy = dy; return; }
      const x = Math.min(Math.max(8, s.r.left + ev.clientX - s.x), innerWidth - s.r.width - 8), y = Math.min(Math.max(60, s.r.top + ev.clientY - s.y), innerHeight - 160);
      Object.assign(panel.style, { left: x + "px", top: y + "px", right: "auto", bottom: "auto", height: s.r.height + "px" });
    });
    head.addEventListener("pointerup", () => { if(!s) return; panel.style.transition = "transform .22s ease"; if(s.phone){ if((s.dy || 0) > 120) close(); panel.style.transform = ""; } s = null; });
  }
  function chips(){
    const list = CHIPS[current] || ["Summarize this page", "What needs a decision here?"];
    panel.querySelector("#cChips").innerHTML = msgs.length > 6 ? "" : list.map(c => '<button type="button" class="chip">' + E(c) + '</button>').join("");
    panel.querySelector("#cSub").textContent = "Reading the " + tabName() + " page with you";
  }
  function draw(){
    const box = panel.querySelector("#cMsgs");
    if(!msgs.length) box.innerHTML = '<div class="cm a">Hi ' + E(S.meName || "") + '. I can see the ' + E(tabName()) + ' page you have open. Ask me what something means, what to deal with first, or where to go to fix it. I can read, but I cannot change anything.</div>';
    else box.innerHTML = msgs.map(m => '<div class="cm ' + (m.role === "user" ? "u" : "a") + (m.typing ? " typing" : "") + '">' + (m.role === "user" ? E(m.content) : fmt(m.content)) + '</div>').join("") + (busy && !msgs[msgs.length - 1].content ? '<div class="cthink"><i></i><i></i><i></i></div>' : '');
    box.scrollTop = box.scrollHeight; chips();
  }
  async function ask(q){
    q = String(q || "").trim(); if(!q || busy) return;
    msgs.push({ role:"user", content:q }); const a = { role:"assistant", content:"", typing:true }; msgs.push(a); busy = true; draw();
    panel.querySelector("#cSend").disabled = true;
    try{
      const r = await fetch("/api/claude", { method:"POST", headers:{ authorization:"Bearer " + TOKEN, "content-type":"application/json" },
        body: JSON.stringify({ question:q, page:{ tab: current, title: tabName(), text: pageText() }, history: msgs.slice(0, -2).slice(-HIST).map(m => ({ role:m.role, content:m.content })) }) });
      if(!r.ok){ const b = await r.json().catch(() => ({})); throw new Error(b.message || ("Claude did not answer (" + r.status + ").")); }
      const rd = r.body.getReader(), dec = new TextDecoder();
      for(;;){ const { value, done } = await rd.read(); if(done) break; a.content += dec.decode(value, { stream:true }); draw(); }
      if(!a.content.trim()) a.content = "I did not get an answer back. Try asking again.";
    }catch(e){ a.content = e.message || "Claude could not be reached. Check for signal and try again."; a.err = true; }
    a.typing = false; busy = false; draw(); panel.querySelector("#cSend").disabled = false;
    panel.querySelector("#cHand").href = handOver(q);
  }
  function open(){ if(!panel) build(); panel.hidden = false; bub.style.opacity = "0"; bub.style.pointerEvents = "none"; draw(); panel.querySelector("#cHand").href = handOver(""); setTimeout(() => panel.querySelector("#cIn").focus(), 60); }
  function close(){ if(!panel) return; panel.hidden = true; panel.style.transform = ""; bub.style.opacity = ""; bub.style.pointerEvents = ""; }
  function toggle(){ if(panel && !panel.hidden) close(); else open(); }
  return { mount, open, close, ask, status: () => ready };
})();

/* ---------- the command centre walkthrough ----------
   Built to the same house standard as the shop's walkthrough (public/tour.js):
   - it points at real parts of the screen through data-tour attributes
   - every step is spoken AND written on screen in the same words
   - the voice is on by default, the first step says so, and one press of
     "Stop the voice" keeps it quiet for the rest of the tour and the next one
   - two steps ask the person to do the thing, and neither can trap anybody:
     each lets go on its own after 45 seconds
   - a step whose part of the screen is not there for this person is skipped,
     and the chapter count adapts (Jen has no Field section, Amir has no Office)
   - it starts on its own once, the first time someone opens the command centre
     on a device, and only after the numbers have loaded
   Like the shop's tour, the voice is recorded clips (public/tour/cc), so it
   sounds the same, and natural, on every device. Change a line's words and its
   clip needs recording again; until then that line falls back to the device's
   own voice if its clip is missing. */
const CCTOUR = (function(){
  const SEEN = "am-command-tour-seen.v1", MUTE = "am-command-tour-muted", RELEASE_MS = 45000;
  const q = s => document.querySelector(s);
  const has = sec => CFG.tabs.some(t => secOf(t) === sec);

  function chapters(){
    const name = S.meName ? S.meName + ", this" : "This";
    const fieldOrOffice = has("Field") ? "Field" : "Office";
    return [
      { id:"welcome", bookend:true, at:"overview", clips:["welcome"],
        title:"The whole company on one screen",
        body: "Hi" + (S.meName ? " " + S.meName : "") + ", and welcome" + " to the A&M Office Command Centre! I'm really glad you're here. This is where JobTread, QuickBooks and the shop come together, so everything that needs a decision is in one place. Let's take a quick look around. It only takes about three minutes. I'll talk as we go, and the words are on screen too, so if you'd rather read, just press Stop the voice." },
      { id:"sections", target:"#secs", at:"overview",
