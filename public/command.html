        clips:["sections"].concat(has("Office") ? ["sections-office"] : [], has("Field") ? ["sections-field"] : [], has("Assistants") ? ["sections-assistants"] : [], has("Admin") ? ["sections-admin"] : [], ["sections-red", has("Field") ? "press-field" : "press-office"]),

        gate:{ click:"#secs .sec" } },

        title:"Ask Claude",
        body:"And this little round button is Claude. Press it any time to ask about the page you're on: what a number means, what to tackle first, or where to fix something. You can drag it anywhere on the screen and it'll stay put. And if you have your own Claude account, Continue in my own Claude carries the conversation over." },

        body:"Up here, the dot shows the numbers are live and when they were last read. They refresh on their own every few minutes, and Refresh reads them again right now. My account shows what you can see and do, and it's where you change your password. Sign out signs you out on this device, and if it sits unused for a while, it'll ask for your password again." },

    ];
  }

  let steps = [], i = 0, liveTour = false, muted = false, gateOk = true, gateOff = null, releaseTimer = null;
  const countable = () => steps.filter(s => !s.bookend);

  /* ---------- the voice ----------
     Every line is a recorded clip in public/tour/cc, in the same natural voice
     on every phone and computer. The words are in tools/Narration-Script-
     Command-Centre.md; tools/generate-narration.py turns them into the clips
     (Bruce's walkthrough kit, edge-tts, Andrew). A real recording can replace
     any clip by saving over the file of the same name.
     The words on screen can say the person's name; the clips do not, so they
     never need re-recording for a new person. A step whose words depend on the
     person (which sections they have) plays its clips one after another.
     If a clip will not load, that step falls back to the device's own voice.
     Browsers refuse sound until the person has touched the page once; when that
     happens the step waits and plays at their first click or key. */
  let queue = [], player = null, waitingForTouch = false;
  function deviceVoice(){
    try{
      const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      const rank = v => (/natural|neural|premium|enhanced|online/i.test(v.name) ? 0 : /google|siri|samantha|ava|aria|jenny|clara/i.test(v.name) ? 1 : 2) * 10 + (/en-CA/i.test(v.lang) ? 0 : /en-US/i.test(v.lang) ? 1 : 2);
      return vs.sort((a, b) => rank(a) - rank(b))[0] || null;
    }catch(e){ return null; }
  }
  function sayWithDevice(text){
    if(!text || !window.speechSynthesis) return;
    try{
      /* One sentence at a time: some browsers cut off a long line part way. */
      const v = deviceVoice();
      String(text).split(/(?<=[.!?])\s+/).forEach(t => { const u = new SpeechSynthesisUtterance(t); if(v) u.voice = v; u.rate = 0.95; speechSynthesis.speak(u); });
    }catch(e){}
  }
  function playNext(fallbackText){
    if(muted || !queue.length) return;
    const clip = queue[0];
    player = new Audio("tour/cc/" + clip + ".mp3");
    player.onended = () => { queue.shift(); playNext(fallbackText); };
    player.onerror = () => { queue = []; player = null; sayWithDevice(fallbackText); };
    const p = player.play();
    if(p && p.catch) p.catch(err => {
      if(err && err.name === "NotAllowedError"){
        if(waitingForTouch) return; waitingForTouch = true;
        const go = () => { ["pointerdown", "keydown"].forEach(ev => document.removeEventListener(ev, go, true)); waitingForTouch = false; if(!muted && queue.length) playNext(fallbackText); };
        ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, go, true));
      } else { queue = []; sayWithDevice(fallbackText); }
    });
  }
  function speak(step){
    hush();
    if(muted || !step) return;
    if(step.clips && step.clips.length){ queue = step.clips.slice(); playNext(step.body); }
    else sayWithDevice(step.body);
  }
  function hush(){
    queue = [];
    if(player){ try{ player.onended = null; player.onerror = null; player.pause(); }catch(e){} player = null; }
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  }
  function setMuted(v){
    muted = v; try{ localStorage.setItem(MUTE, v ? "1" : "0"); }catch(e){}
    if(v) hush(); else speak(steps[i]);
    paint();
  }

  /* ---------- the spotlight ---------- */
  function spot(el){
    const s = q("#ccSpot"); if(!s) return;
    if(!el){ s.style.display = "none"; return; }
    const r = el.getBoundingClientRect(), pad = 6;
    s.style.display = "block";
    s.style.top = (r.top - pad) + "px"; s.style.left = (r.left - pad) + "px";
    s.style.width = (r.width + pad * 2) + "px"; s.style.height = (r.height + pad * 2) + "px";
  }
  function place(el){
    const c = q("#ccCard"); if(!c) return;
    c.style.left = "50%"; c.style.transform = "translateX(-50%)";
    if(!el){ c.style.top = ""; c.style.bottom = "20px"; return; }
    const r = el.getBoundingClientRect();
    if(window.innerHeight - r.bottom > 280){ c.style.top = Math.max(r.bottom + 14, 10) + "px"; c.style.bottom = ""; }
    else if(r.top > 280){ c.style.bottom = (window.innerHeight - r.top + 14) + "px"; c.style.top = ""; }
    else { c.style.top = ""; c.style.bottom = "14px"; }
  }

  /* ---------- try-it steps ---------- */
  function clearGate(){ if(gateOff){ gateOff(); gateOff = null; } clearTimeout(releaseTimer); releaseTimer = null; }
  function armGate(step){
    clearGate();
    if(!step.gate){ gateOk = true; return; }
    gateOk = false;
    const pass = () => { if(!gateOk){ gateOk = true; paint(); } };
    const h = e => { if(e.target && e.target.closest && e.target.closest(step.gate.click)) setTimeout(pass, 250); };
    document.addEventListener("click", h, true);
    gateOff = () => document.removeEventListener("click", h, true);
    releaseTimer = setTimeout(pass, RELEASE_MS);   /* a nudge, never a lock */
  }

  /* ---------- drawing ---------- */
  function paint(){
    const step = steps[i]; if(!step) return;
    const el = step.target ? q(step.target) : null;
    spot(el); place(el);
    const total = countable().length, no = step.bookend ? 0 : countable().indexOf(step) + 1, last = i === steps.length - 1;
    q("#ccCard").innerHTML =
      '<div class="cct-head"><span class="cct-count">' + (no ? "Step " + no + " of " + total : (last ? "Done" : "Welcome")) + '</span>' +
      '<button class="cct-x" id="cctSkip">' + (last ? "Close" : "Skip the tour") + '</button></div>' +
      '<h3>' + E(step.title) + '</h3><p class="cct-body">' + E(step.body) + '</p>' +
      '<div class="cct-foot"><button class="cct-mute" id="cctMute">' + (muted ? "Play the voice" : "Stop the voice") + '</button>' +
      '<div class="cct-nav">' + (i > 0 ? '<button class="cct-back" id="cctBack">Back</button>' : '') +
      '<button class="cct-next" id="cctNext"' + (gateOk ? '' : ' disabled') + '>' + (last ? "Finish" : "Next") + '</button></div></div>' +
      (gateOk ? '' : '<div class="cct-wait">Have a go at it, then Next opens.</div>');
    q("#cctSkip").onclick = finish;
    q("#cctMute").onclick = () => setMuted(!muted);
    const b = q("#cctBack"); if(b) b.onclick = () => show(i - 1, -1);
    q("#cctNext").onclick = () => { if(gateOk) last ? finish() : show(i + 1, 1); };
  }
  function waitFor(sel, ms){
    return new Promise(res => {
      if(!sel || q(sel)) return res(true);
      const t0 = Date.now(), iv = setInterval(() => {
        if(q(sel)){ clearInterval(iv); res(true); }
        else if(Date.now() - t0 > (ms || 2000)){ clearInterval(iv); res(false); }
      }, 120);
    });
  }
  async function show(n, dir){
    if(n < 0) n = 0;
    if(n >= steps.length) return finish();
    i = n; const step = steps[i];
    if(!step.keepDrawer && drawerState) closeDrawer();
    if(step.at && current !== step.at && CFG.tabs.includes(step.at)) go(step.at);
    if(step.target){
      const there = await waitFor(step.target);
      /* Not on this person's screen: move on in the direction they were going. */
      if(!there) return show(n + (dir || 1), dir || 1);
      const el = q(step.target);
      if(el && step.target !== "#drawer" && step.target !== "#secs" && step.target !== "#tabs") el.scrollIntoView({ block:"center" });
      await new Promise(r => setTimeout(r, 200));
    }
    armGate(step); speak(step); paint();
  }

  /* ---------- start and stop ---------- */
  function start(){
    if(liveTour) return;
    liveTour = true;
    try{ muted = localStorage.getItem(MUTE) === "1"; }catch(e){ muted = false; }
    steps = chapters().filter(s => !s.at || CFG.tabs.includes(s.at));
    if(!q("#ccTour")){
      const d = document.createElement("div"); d.id = "ccTour";
      d.innerHTML = '<div id="ccSpot"></div><div id="ccCard" role="dialog" aria-live="polite" aria-label="Walkthrough"></div>';
      document.body.appendChild(d);
    }
    document.body.classList.add("cct-on");
    show(0, 1);
  }
  function finish(){
    liveTour = false; clearGate(); hush();
    const d = q("#ccTour"); if(d) d.remove();
    document.body.classList.remove("cct-on");
    if(drawerState) closeDrawer();
    try{ localStorage.setItem(SEEN, "1"); }catch(e){}
    go("overview");
  }
  window.addEventListener("resize", () => { if(liveTour) paint(); });
  window.addEventListener("scroll", () => { if(liveTour) paint(); }, true);
  /* The page redraws itself every few minutes. Put the spotlight back on top. */
  const keep = new MutationObserver(() => { if(liveTour) requestAnimationFrame(paint); });
  const watchMain = () => { const m = q("#main"); if(m) keep.observe(m, { childList:true }); };
  if(q("#main")) watchMain(); else document.addEventListener("DOMContentLoaded", watchMain);

  return {
    start,
    ready(){ try{ if(localStorage.getItem(SEEN) === "1") return; }catch(e){ return; } start(); },
    replay(){ try{ localStorage.removeItem(SEEN); }catch(e){} start(); }
  };
})();

start();
</script>
</body></html>
