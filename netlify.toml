[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo no build step"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/command.html"
  [headers.values]
    Cache-Control = "no-cache"
